name: Momentum Detector

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnosticar Twelve Data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          symbols = "NVDA,AMD,TSLA,PLTR,COIN,HOOD,MSTR,SMCI"

          params = urllib.parse.urlencode({
              "symbol": symbols,
              "interval": "1min",
              "outputsize": "61",
              "apikey": API_KEY
          })

          url = (
              "https://api.twelvedata.com/time_series?"
              + params
          )

          print("Consultando Twelve Data...")
          print("Símbolos:", symbols)
          print()

          try:

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "MomentumDetector/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  raw = response.read().decode()

              print("Respuesta recibida:")
              print(raw)

              print()
              print("=" * 60)

              data = json.loads(raw)

              print("Tipo de respuesta:")
              print(type(data))

              print()
              print("Claves principales:")

              if isinstance(data, dict):

                  print(
                      list(data.keys())[:30]
                  )

              print()
              print("Diagnóstico terminado.")

          except Exception as e:

              print()
              print("❌ ERROR:")
              print(type(e).__name__)
              print(str(e))

              raise SystemExit(1)

          PY
