name: Momentum Detector

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  momentum:
    runs-on: ubuntu-latest

    steps:
      - name: Escanear acciones
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]
          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          SYMBOLS = [
              "NVDA",
              "AMD",
              "TSLA",
              "PLTR",
              "COIN",
              "HOOD",
              "MSTR",
              "SMCI"
          ]

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": message
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=data
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  return response.read().decode()

          print("🚨 MOMENTUM DETECTOR")
          print("=" * 60)

          symbols_string = ",".join(SYMBOLS)

          params = urllib.parse.urlencode({
              "symbol": symbols_string,
              "interval": "1min",
              "outputsize": "61",
              "apikey": API_KEY
          })

          url = (
              "https://api.twelvedata.com/time_series?"
              + params
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "MomentumDetector/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  data = json.load(response)

          except Exception as e:

              print("❌ Error consultando Twelve Data:")
              print(e)
              raise SystemExit(1)

          alerts = 0
          errors = 0

          for symbol in SYMBOLS:

              try:

                  # Twelve Data puede devolver los símbolos
                  # como claves independientes en una respuesta batch.
                  if symbol not in data:

                      print(
                          f"⚠️ {symbol}: "
                          "sin datos"
                      )

                      errors += 1
                      continue

                  symbol_data = data[symbol]

                  if "values" not in symbol_data:

                      print(
                          f"⚠️ {symbol}: "
                          "datos no disponibles"
                      )

                      errors += 1
                      continue

                  values = symbol_data["values"]

                  if len(values) < 61:

                      print(
                          f"⚠️ {symbol}: "
                          f"solo {len(values)} velas"
                      )

                      errors += 1
                      continue

                  current_price = float(
                      values[0]["close"]
                  )

                  old_price = float(
                      values[60]["close"]
                  )

                  change = (
                      (current_price - old_price)
                      / old_price
                  ) * 100

                  volumes = []

                  for candle in values:

                      if "volume" in candle:

                          volumes.append(
                              float(candle["volume"])
                          )

                  if len(volumes) < 2:

                      print(
                          f"{symbol}: "
                          "sin volumen"
                      )

                      continue

                  current_volume = volumes[0]

                  average_volume = (
                      sum(volumes[1:])
                      / len(volumes[1:])
                  )

                  if average_volume > 0:

                      volume_ratio = (
                          current_volume
                          / average_volume
                      )

                  else:

                      volume_ratio = 0

                  print(
                      f"{symbol}: "
                      f"${current_price:.2f} | "
                      f"60m: {change:+.2f}% | "
                      f"Volumen: "
                      f"{volume_ratio:.1f}x"
                  )

                  if (
                      change >= 10
                      and volume_ratio >= 3
                  ):

                      message = (
                          "🚨 MOMENTUM DETECTADO 🚨\n\n"
                          f"📈 Acción: {symbol}\n"
                          f"💰 Precio: "
                          f"${current_price:.2f}\n"
                          f"📊 60 minutos: "
                          f"+{change:.2f}%\n"
                          f"🔥 Volumen: "
                          f"{volume_ratio:.1f}x "
                          "la media\n\n"
                          "⚠️ Señal de momentum. "
                          "No es una recomendación "
                          "automática de compra."
                      )

                      try:

                          send_telegram(message)

                          print(
                              f"📱 ALERTA ENVIADA: "
                              f"{symbol}"
                          )

                          alerts += 1

                      except Exception as e:

                          print(
                              f"❌ Error Telegram: "
                              f"{e}"
                          )

              except Exception as e:

                  print(
                      f"⚠️ {symbol}: ERROR - {e}"
                  )

                  errors += 1

          print("=" * 60)

          print(
              f"Alertas enviadas: {alerts}"
          )

          print(
              f"Acciones con errores: {errors}"
          )

          print("Escaneo terminado.")
          PY
