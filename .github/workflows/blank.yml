name: Momentum Detector

on:
  workflow_dispatch:
  schedule:

    - cron: "*/15 * * * *"

jobs:
  momentum:
    runs-on: ubuntu-latest

    steps:
      - name: Escanear acciones y enviar alertas
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]
          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          SYMBOLS = [
              "NVDA",
              "AMD",
              "TSLA",
              "PLTR",
              "COIN",
              "HOOD",
              "MSTR",
              "SMCI"
          ]

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": message
              }).encode()

              request = urllib.request.Request(url, data=data)

              with urllib.request.urlopen(request) as response:
                  return response.read().decode()

          print("🚨 MOMENTUM DETECTOR")
          print("=" * 60)

          alerts = 0

          for symbol in SYMBOLS:

              try:
                  params = urllib.parse.urlencode({
                      "symbol": symbol,
                      "interval": "1min",
                      "outputsize": "61",
                      "apikey": API_KEY
                  })

                  url = (
                      "https://api.twelvedata.com/time_series?"
                      + params
                  )

                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "MomentumDetector/1.0"}
                  )

                  with urllib.request.urlopen(request) as response:
                      data = json.load(response)

                  if "values" not in data:
                      print(f"{symbol}: sin datos")
                      continue

                  values = data["values"]

                  if len(values) < 61:
                      print(f"{symbol}: datos insuficientes")
                      continue

                  current_price = float(values[0]["close"])
                  old_price = float(values[60]["close"])

                  change = (
                      (current_price - old_price)
                      / old_price
                  ) * 100

                  print(
                      f"{symbol}: "
                      f"${current_price:.2f} | "
                      f"60 min: {change:+.2f}%"
                  )

                  if change >= 10:

                      message = (
                          "🚨 MOMENTUM DETECTADO 🚨\n\n"
                          f"📈 Acción: {symbol}\n"
                          f"💰 Precio: ${current_price:.2f}\n"
                          f"📊 Movimiento 60 min: +{change:.2f}%\n\n"
                          "⚠️ No es una recomendación automática de compra."
                      )

                      send_telegram(message)

                      print(
                          f"📱 ALERTA ENVIADA A TELEGRAM: {symbol}"
                      )

                      alerts += 1

              except Exception as e:
                  print(f"⚠️ {symbol}: datos no disponibles ({e})") continue

          print("=" * 60)
          print(f"Alertas enviadas: {alerts}")
          print("Escaneo terminado.")
          PY
