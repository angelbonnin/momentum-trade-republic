name: Momentum Detector

on:
  workflow_dispatch:

jobs:
  twelve-test:
    runs-on: ubuntu-latest

    steps:
      - name: Probar Twelve Data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          api_key = os.environ["TWELVE_DATA_API_KEY"]

          params = urllib.parse.urlencode({
              "symbol": "NVDA",
              "interval": "1min",
              "outputsize": "10",
              "apikey": api_key
          })

          url = "https://api.twelvedata.com/time_series?" + params

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "MomentumDetector/1.0"}
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          if "values" in data:
              print("✅ TWELVE DATA FUNCIONANDO")
              print("Velas recibidas:", len(data["values"]))
              print()
              print("Última vela:")
              print(data["values"][0])
          else:
              print("❌ Twelve Data respondió con un error:")
              print(json.dumps(data, indent=2))
              raise SystemExit(1)
          PY
