name: Opportunity Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: opportunity-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Opportunity Scanner V8
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json
          import subprocess
          from datetime import datetime, timezone, timedelta

          TD = os.environ["TWELVE_DATA_API_KEY"]
          MX = os.environ["MARKETAUX_API_KEY"]
          BOT = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT = os.environ["TELEGRAM_CHAT_ID"]

          run = int(
              os.environ.get("RUN_NUMBER", "1")
          )

          # ==================================================
          # CONFIGURACIÓN
          # ==================================================

          STATE_FILE = "scanner_state.json"
          SIGNAL_FILE = "signal_log.json"

          # ==================================================
          # UNIVERSO
          # ==================================================

          groups = [

              [
                  "NVDA","AMD","AVGO","MU",
                  "MRVL","ARM","SMCI","INTC"
              ],

              [
                  "TSLA","PLTR","APP","HOOD",
                  "COIN","MSTR","MARA","RIVN"
              ],

              [
                  "META","AMZN","NFLX","GOOG",
                  "GOOGL","AAPL","MSFT","ORCL"
              ],

              [
                  "CRWD","PANW","SNOW","DDOG",
                  "NET","RBLX","SHOP","U"
              ],

              [
                  "UBER","ABNB","CVNA","SOFI",
                  "NIO","LI","XPEV","BABA"
              ],

              [
                  "JPM","BAC","GS","MS",
                  "C","WFC","V","MA"
              ],

              [
                  "MRNA","PFE","LLY","BNTX",
                  "REGN","VRTX","GILD","BIIB"
              ],

              [
                  "XOM","CVX","OXY","SLB",
                  "COP","FANG","MPC","VLO"
              ],

              [
                  "BA","GE","CAT","DE",
                  "LMT","RTX","NOC","GD"
              ],

              [
                  "T","VZ","TMUS","CMCSA",
                  "DIS","WBD","TGT","COST"
              ]

          ]

          group_index = (
              (run - 1) % len(groups)
          )

          symbols = groups[group_index]

          now = datetime.now(
              timezone.utc
          )

          print("=" * 70)
          print("🚨 OPPORTUNITY SCANNER V8")
          print("=" * 70)

          print(
              f"Grupo {group_index + 1}/"
              f"{len(groups)}"
          )

          # ==================================================
          # CARGAR MEMORIA
          # ==================================================

          try:

              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  state = json.load(f)

          except:

              state = {}

          if not isinstance(state, dict):

              state = {}

          # ==================================================
          # CARGAR REGISTRO DE SEÑALES
          # ==================================================

          try:

              with open(
                  SIGNAL_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  signals = json.load(f)

          except:

              signals = []

          if not isinstance(signals, list):

              signals = []

          # ==================================================
          # TELEGRAM
          # ==================================================

          def telegram(message):

              url = (
                  "https://api.telegram.org/"
                  f"bot{BOT}/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": CHAT,
                  "text": message
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=data
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  return response.read()

          # ==================================================
          # TWELVE DATA
          # ==================================================

          def get_market_data(
              requested_symbols
          ):

              params = urllib.parse.urlencode({
                  "symbol":
                      ",".join(
                          requested_symbols
                      ),
                  "interval":
                      "1min",
                  "outputsize":
                      "391",
                  "apikey":
                      TD
              })

              url = (
                  "https://api.twelvedata.com/"
                  "time_series?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "OpportunityScanner/8.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  return json.load(response)

          try:

              market = get_market_data(
                  symbols
              )

          except Exception as e:

              print(
                  "❌ ERROR TWELVE DATA"
              )

              print(e)

              raise SystemExit(1)

          # ==================================================
          # CATALIZADORES
          # ==================================================

          strong = [
              "fda",
              "approval",
              "approved",
              "clinical trial",
              "clinical results",
              "phase 1",
              "phase 2",
              "phase 3",
              "positive results",
              "earnings",
              "quarterly results",
              "guidance",
              "acquisition",
              "acquire",
              "merger",
              "contract",
              "major contract",
              "partnership",
              "agreement",
              "deal",
              "regulatory",
              "buyback",
              "share repurchase",
              "product launch"
          ]

          medium = [
              "upgrade",
              "downgrade",
              "price target",
              "analyst",
              "expansion",
              "collaboration",
              "investment",
              "forecast",
              "outlook"
          ]

          def classify(article):

              text = " ".join([
                  str(
                      article.get(
                          "title",
                          ""
                      )
                  ),
                  str(
                      article.get(
                          "description",
                          ""
                      )
                  ),
                  str(
                      article.get(
                          "snippet",
                          ""
                      )
                  )
              ]).lower()

              strong_hits = [
                  x for x in strong
                  if x in text
              ]

              medium_hits = [
                  x for x in medium
                  if x in text
              ]

              if strong_hits:

                  return (
                      "🔴 MUY FUERTE",
                      25,
                      strong_hits
                  )

              if medium_hits:

                  return (
                      "🟠 MEDIO",
                      12,
                      medium_hits
                  )

              return (
                  "⚪ DÉBIL",
                  0,
                  []
              )

          # ==================================================
          # EVALUAR SEÑALES ANTERIORES
          # ==================================================

          completed_updates = 0

          for signal in signals:

              if signal.get(
                  "completed",
                  False
              ):

                  continue

              symbol = signal.get(
                  "symbol"
              )

              if symbol not in market:

                  continue

              data = market.get(
                  symbol,
                  {}
              )

              candles = data.get(
                  "values",
                  []
              )

              if len(candles) < 2:

                  continue

              try:

                  entry_time = (
                      datetime.fromisoformat(
                          signal["timestamp"]
                      )
                  )

                  elapsed = (
                      now
                      - entry_time
                  ).total_seconds() / 60

                  entry_price = float(
                      signal["entry_price"]
                  )

                  # Las velas vienen de más
                  # reciente a más antigua.
                  #
                  # Para evaluar el futuro
                  # respecto a la señal,
                  # buscamos velas posteriores
                  # mediante timestamp.

                  future_prices = []

                  for candle in candles:

                      candle_time = datetime.fromisoformat(
                          candle["datetime"]
                          .replace(
                              "Z",
                              "+00:00"
                          )
                      )

                      if (
                          candle_time
                          >= entry_time
                      ):

                          try:

                              future_prices.append({
                                  "time":
                                      candle_time,

                                  "high":
                                      float(
                                          candle["high"]
                                      ),

                                  "low":
                                      float(
                                          candle["low"]
                                      ),

                                  "close":
                                      float(
                                          candle["close"]
                                      )
                              })

                          except:

                              pass

                  if not future_prices:

                      continue

                  highs = [
                      x["high"]
                      for x in future_prices
                  ]

                  lows = [
                      x["low"]
                      for x in future_prices
                  ]

                  max_high = max(
                      highs
                  )

                  min_low = min(
                      lows
                  )

                  max_gain = (
                      (
                          max_high
                          - entry_price
                      )
                      /
                      entry_price
                  ) * 100

                  max_drawdown = (
                      (
                          min_low
                          - entry_price
                      )
                      /
                      entry_price
                  ) * 100

                  # ==========================================
                  # OBJETIVOS
                  # ==========================================

                  signal["max_gain"] = round(
                      max_gain,
                      2
                  )

                  signal["max_drawdown"] = round(
                      max_drawdown,
                      2
                  )

                  if max_gain >= 5:

                      signal["hit_5"] = True

                  if max_gain >= 10:

                      signal["hit_10"] = True

                  if max_gain >= 15:

                      signal["hit_15"] = True

                  # ==========================================
                  # HORIZONTES
                  # ==========================================

                  checkpoints = [
                      (
                          "15m",
                          15
                      ),
                      (
                          "30m",
                          30
                      ),
                      (
                          "60m",
                          60
                      )
                  ]

                  for label, minutes in checkpoints:

                      if elapsed < minutes:

                          continue

                      candidates = [
                          x
                          for x in future_prices
                          if (
                              x["time"]
                              - entry_time
                          ).total_seconds()
                          <= minutes * 60
                      ]

                      if not candidates:

                          continue

                      last = candidates[-1]

                      result = (
                          (
                              last["close"]
                              -
                              entry_price
                          )
                          /
                          entry_price
                      ) * 100

                      signal[
                          f"return_{label}"
                      ] = round(
                          result,
                          2
                      )

                  # ==========================================
                  # FINALIZAR DESPUÉS DE 60 MIN
                  # ==========================================

                  if elapsed >= 60:

                      signal[
                          "completed"
                      ] = True

                      signal[
                          "completed_at"
                      ] = now.isoformat()

                      completed_updates += 1

              except Exception as e:

                  print(
                      f"⚠️ Error evaluando "
                      f"señal: {e}"
                  )

          # ==================================================
          # ANALISIS DE MERCADO ACTUAL
          # ==================================================

          opportunities = []

          errors = 0

          for symbol in symbols:

              try:

                  if symbol not in market:

                      errors += 1
                      continue

                  data = market[symbol]

                  candles = data.get(
                      "values",
                      []
                  )

                  if len(candles) < 61:

                      continue

                  current = float(
                      candles[0]["close"]
                  )

                  p5 = float(
                      candles[5]["close"]
                  )

                  p15 = float(
                      candles[15]["close"]
                  )

                  p30 = float(
                      candles[30]["close"]
                  )

                  p60 = float(
                      candles[60]["close"]
                  )

                  change5 = (
                      (current - p5)
                      / p5
                  ) * 100

                  change15 = (
                      (current - p15)
                      / p15
                  ) * 100

                  change30 = (
                      (current - p30)
                      / p30
                  ) * 100

                  change60 = (
                      (current - p60)
                      / p60
                  ) * 100

                  # ==========================================
                  # ACELERACIÓN
                  # ==========================================

                  move_30_15 = (
                      (p15 - p30)
                      / p30
                  ) * 100

                  move_15_0 = (
                      (current - p15)
                      / p15
                  ) * 100

                  acceleration = (
                      move_15_0
                      - move_30_15
                  )

                  # ==========================================
                  # VOLUMEN
                  # ==========================================

                  volumes = []

                  for candle in candles:

                      try:

                          volumes.append(
                              float(
                                  candle[
                                      "volume"
                                  ]
                              )
                          )

                      except:

                          pass

                  if len(volumes) >= 10:

                      average_volume = (
                          sum(
                              volumes[1:]
                          )
                          /
                          len(
                              volumes[1:]
                          )
                      )

                      if average_volume > 0:

                          volume_ratio = (
                              volumes[0]
                              /
                              average_volume
                          )

                      else:

                          volume_ratio = 0

                  else:

                      volume_ratio = 0

                  # ==========================================
                  # MÁXIMO
                  # ==========================================

                  highs = []

                  for candle in candles:

                      try:

                          highs.append(
                              float(
                                  candle[
                                      "high"
                                  ]
                              )
                          )

                      except:

                          pass

                  high = (
                      max(highs)
                      if highs
                      else current
                  )

                  distance_high = (
                      (
                          high
                          -
                          current
                      )
                      /
                      high
                  ) * 100

                  # ==========================================
                  # SCORE
                  # ==========================================

                  score = 0

                  if change30 >= 3:
                      score += 20

                  if change30 >= 5:
                      score += 10

                  if volume_ratio >= 3:
                      score += 15

                  if volume_ratio >= 5:
                      score += 10

                  if volume_ratio >= 8:
                      score += 5

                  if acceleration > 0:
                      score += 10

                  if acceleration >= 2:
                      score += 5

                  if distance_high <= 1:
                      score += 5

                  # ==========================================
                  # TIMING
                  # ==========================================

                  if change30 >= 10:

                      timing = (
                          "🔴 EXTENDED"
                      )

                  elif change30 >= 7:

                      timing = (
                          "🟠 LATE"
                      )

                  elif (
                      change30 >= 3
                      and
                      acceleration > 1
                      and
                      volume_ratio >= 3
                  ):

                      timing = (
                          "🟢 EARLY"
                      )

                  elif change30 >= 3:

                      timing = (
                          "🟡 MOMENTUM"
                      )

                  else:

                      timing = (
                          "⚪ NORMAL"
                      )

                  # ==========================================
                  # MEMORIA
                  # ==========================================

                  previous = state.get(
                      symbol,
                      {}
                  )

                  previous_score = float(
                      previous.get(
                          "score",
                          0
                      )
                  )

                  previous_volume = float(
                      previous.get(
                          "volume_ratio",
                          0
                      )
                  )

                  previous_change = float(
                      previous.get(
                          "change30",
                          0
                      )
                  )

                  previous_timing = previous.get(
                      "timing",
                      "⚪ NORMAL"
                  )

                  score_delta = (
                      score
                      -
                      previous_score
                  )

                  volume_delta = (
                      volume_ratio
                      -
                      previous_volume
                  )

                  price_delta = (
                      change30
                      -
                      previous_change
                  )

                  accelerating = (

                      score_delta >= 10

                      or

                      volume_delta >= 1.5

                      or

                      price_delta >= 1.0

                  )

                  state_change = (

                      previous_timing
                      !=
                      timing

                      and

                      timing
                      !=
                      "⚪ NORMAL"

                  )

                  # ==========================================
                  # PENALIZACIÓN
                  # ==========================================

                  adjusted_score = score

                  if timing == "🟠 LATE":

                      adjusted_score -= 10

                  elif timing == "🔴 EXTENDED":

                      adjusted_score -= 20

                  adjusted_score = max(
                      0,
                      adjusted_score
                  )

                  # ==========================================
                  # FILTRO
                  # ==========================================

                  if not (
                      change30 >= 3
                      and
                      volume_ratio >= 3
                      and
                      adjusted_score >= 45
                  ):

                      state[symbol] = {

                          "score":
                              score,

                          "volume_ratio":
                              volume_ratio,

                          "change30":
                              change30,

                          "timing":
                              timing,

                          "updated":
                              now.isoformat(),

                          "last_alert":
                              previous.get(
                                  "last_alert",
                                  ""
                              )

                      }

                      continue

                  # ==========================================
                  # NOTICIAS
                  # ==========================================

                  after = (
                      now
                      -
                      timedelta(hours=3)
                  ).strftime(
                      "%Y-%m-%dT%H:%M"
                  )

                  news_params = urllib.parse.urlencode({

                      "api_token": MX,

                      "symbols": symbol,

                      "filter_entities":
                          "true",

                      "must_have_entities":
                          "true",

                      "language":
                          "en",

                      "limit":
                          "5",

                      "published_after":
                          after,

                      "sort":
                          "published_at"

                  })

                  news_url = (
                      "https://api.marketaux.com/"
                      "v1/news/all?"
                      + news_params
                  )

                  news_request = urllib.request.Request(
                      news_url,
                      headers={
                          "User-Agent":
                          "OpportunityScanner/8.0"
                      }
                  )

                  articles = []

                  try:

                      with urllib.request.urlopen(
                          news_request,
                          timeout=30
                      ) as response:

                          news_data = json.load(
                              response
                          )

                      articles = news_data.get(
                          "data",
                          []
                      )

                  except Exception as e:

                      print(
                          f"⚠️ News {symbol}: "
                          f"{e}"
                      )

                  best = None
                  news_bonus = 0
                  category = (
                      "⚪ SIN CATALIZADOR"
                  )
                  hits = []

                  for article in articles:

                      cat, bonus, found = (
                          classify(article)
                      )

                      if bonus > news_bonus:

                          best = article
                          news_bonus = bonus
                          category = cat
                          hits = found

                  # ==========================================
                  # SCORE FINAL
                  # ==========================================

                  final_score = min(
                      100,
                      adjusted_score
                      +
                      news_bonus
                  )

                  if final_score >= 90:

                      level = (
                          "🔴 EXCEPCIONAL"
                      )

                  elif final_score >= 80:

                      level = (
                          "🔴 MUY FUERTE"
                      )

                  elif final_score >= 70:

                      level = (
                          "🟠 FUERTE"
                      )

                  elif final_score >= 55:

                      level = (
                          "🟡 INTERESANTE"
                      )

                  else:

                      level = (
                          "⚪ VIGILAR"
                      )

                  # ==========================================
                  # GUARDAR CANDIDATA
                  # ==========================================

                  opportunity = {

                      "symbol":
                          symbol,

                      "score":
                          final_score,

                      "timing":
                          timing,

                      "price":
                          current,

                      "change5":
                          change5,

                      "change15":
                          change15,

                      "change30":
                          change30,

                      "change60":
                          change60,

                      "volume":
                          volume_ratio,

                      "acceleration":
                          acceleration,

                      "distance_high":
                          distance_high,

                      "category":
                          category,

                      "news_bonus":
                          news_bonus,

                      "accelerating":
                          accelerating,

                      "state_change":
                          state_change,

                      "title":
                          (
                              best.get(
                                  "title",
                                  ""
                              )
                              if best
                              else ""
                          ),

                      "source":
                          (
                              best.get(
                                  "source",
                                  ""
                              )
                              if best
                              else ""
                          ),

                      "url":
                          (
                              best.get(
                                  "url",
                                  ""
                              )
                              if best
                              else ""
                          ),

                      "level":
                          level

                  }

                  opportunities.append(
                      opportunity
                  )

                  # ==========================================
                  # COOLDOWN
                  # ==========================================

                  last_alert_text = (
                      previous.get(
                          "last_alert",
                          ""
                      )
                  )

                  cooldown_ok = True

                  if last_alert_text:

                      try:

                          last_alert = (
                              datetime.fromisoformat(
                                  last_alert_text
                              )
                          )

                          minutes_since = (
                              (
                                  now
                                  -
                                  last_alert
                              ).total_seconds()
                              / 60
                          )

                          if minutes_since < 60:

                              cooldown_ok = False

                      except:

                          pass

                  # ==========================================
                  # CREAR SEÑAL
                  # ==========================================

                  important = (

                      final_score >= 70

                      and

                      (
                          accelerating
                          or
                          state_change
                          or
                          news_bonus >= 25
                      )

                      and

                      timing
                      !=
                      "🔴 EXTENDED"

                  )

                  if important and cooldown_ok:

                      signal_id = (
                          f"{symbol}_"
                          f"{now.isoformat()}"
                      )

                      signal = {

                          "id":
                              signal_id,

                          "symbol":
                              symbol,

                          "timestamp":
                              now.isoformat(),

                          "entry_price":
                              current,

                          "score":
                              final_score,

                          "timing":
                              timing,

                          "volume":
                              volume_ratio,

                          "acceleration":
                              acceleration,

                          "change30":
                              change30,

                          "category":
                              category,

                          "news_bonus":
                              news_bonus,

                          "completed":
                              False,

                          "hit_5":
                              False,

                          "hit_10":
                              False,

                          "hit_15":
                              False

                      }

                      signals.append(
                          signal
                      )

                      print(
                          f"📌 NUEVA SEÑAL "
                          f"REGISTRADA: "
                          f"{symbol}"
                      )

                      # ========================================
                      # TELEGRAM
                      # ========================================

                      message = (
                          "🚨 NUEVA SEÑAL V8\n\n"

                          f"📈 {symbol}\n"

                          f"🎯 Score: "
                          f"{final_score}/100\n"

                          f"{level}\n\n"

                          f"⏱ {timing}\n"

                          f"💰 ${current:.2f}\n"

                          f"📊 30m: "
                          f"{change30:+.2f}%\n"

                          f"🔥 Volumen: "
                          f"{volume_ratio:.1f}x\n"

                          f"⚡ Aceleración: "
                          f"{acceleration:+.2f}\n\n"

                          f"📰 {category}\n\n"

                          "🧪 SEÑAL REGISTRADA "
                          "PARA MEDIR SU "
                          "RESULTADO."
                      )

                      if best:

                          message += (
                              f"\n\n{best.get("
                              "'title',"
                              "''
                              )}"
                          )

                          article_url = best.get(
                              "url",
                              ""
                          )

                          if article_url:

                              message += (
                                  f"\n{article_url}"
                              )

                      try:

                          telegram(message)

                          last_alert_text = (
                              now.isoformat()
                          )

                      except Exception as e:

                          print(
                              f"⚠️ Telegram: "
                              f"{e}"
                          )

                  # ==========================================
                  # ESTADO
                  # ==========================================

                  state[symbol] = {

                      "score":
                          adjusted_score,

                      "volume_ratio":
                          volume_ratio,

                      "change30":
                          change30,

                      "timing":
                          timing,

                      "updated":
                          now.isoformat(),

                      "last_alert":
                          last_alert_text

                  }

              except Exception as e:

                  print(
                      f"⚠️ {symbol}: "
                      f"{type(e).__name__}: "
                      f"{e}"
                  )

                  errors += 1

          # ==================================================
          # LIMITAR MEMORIA
          # ==================================================

          if len(signals) > 500:

              signals = signals[-500:]

          # ==================================================
          # RANKING
          # ==================================================

          opportunities.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          # ==================================================
          # ESTADÍSTICAS
          # ==================================================

          completed = [
              s
              for s in signals
              if s.get(
                  "completed",
                  False
              )
          ]

          total_completed = len(
              completed
          )

          hit5 = sum(
              1
              for s in completed
              if s.get(
                  "hit_5",
                  False
              )
          )

          hit10 = sum(
              1
              for s in completed
              if s.get(
                  "hit_10",
                  False
              )
          )

          hit15 = sum(
              1
              for s in completed
              if s.get(
                  "hit_15",
                  False
              )
          )

          # ==================================================
          # TELEGRAM RESUMEN
          # ==================================================

          summary = (
              "📊 MARKET SCAN V8\n\n"
              f"Grupo "
              f"{group_index + 1}/"
              f"{len(groups)}\n\n"
          )

          if opportunities:

              summary += (
                  "🏆 TOP OPORTUNIDADES\n\n"
              )

              medals = [
                  "🥇",
                  "🥈",
                  "🥉"
              ]

              for i, item in enumerate(
                  opportunities[:5]
              ):

                  medal = (
                      medals[i]
                      if i < 3
                      else "▪️"
                  )

                  summary += (
                      f"{medal} "
                      f"{item['symbol']} "
                      f"— "
                      f"{item['score']:.0f}/100\n"
                      f"   {item['timing']} | "
                      f"{item['change30']:+.2f}% | "
                      f"Vol "
                      f"{item['volume']:.1f}x\n"
                  )

          else:

              summary += (
                  "😴 Sin oportunidades "
                  "destacables.\n"
              )

          summary += (
              "\n🧪 RESULTADOS HISTÓRICOS "
              "DEL RADAR\n\n"

              f"Señales evaluadas: "
              f"{total_completed}\n"

              f"🎯 +5%: "
              f"{hit5}\n"

              f"🚀 +10%: "
              f"{hit10}\n"

              f"🔥 +15%: "
              f"{hit15}\n"
          )

          if total_completed > 0:

              summary += (
                  "\n📈 Tasa +5%: "
                  f"{hit5 / total_completed * 100:.1f}%\n"

                  "📈 Tasa +10%: "
                  f"{hit10 / total_completed * 100:.1f}%\n"

                  "📈 Tasa +15%: "
                  f"{hit15 / total_completed * 100:.1f}%\n"
              )

          summary += (
              "\n\n"
              f"📡 Acciones: "
              f"{len(symbols)}\n"

              f"🔎 Candidatas: "
              f"{len(opportunities)}\n"

              f"⚠️ Errores: "
              f"{errors}\n"

              "\n🧠 Registro actualizado."
          )

          try:

              telegram(summary)

              print(
                  "📱 Resumen enviado"
              )

          except Exception as e:

              print(
                  f"⚠️ Telegram resumen: "
                  f"{e}"
              )

          # ==================================================
          # GUARDAR ARCHIVOS
          # ==================================================

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              SIGNAL_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  signals,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ==================================================
          # COMMIT
          # ==================================================

          try:

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]"
                      "@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      STATE_FILE,
                      SIGNAL_FILE
                  ],
                  check=True
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )

              if result.returncode != 0:

                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Update scanner data"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "push"
                      ],
                      check=True
                  )

                  print(
                      "💾 Datos guardados"
                  )

          except Exception as e:

              print(
                  "⚠️ Error guardando "
                  "datos:"
              )

              print(e)

          # ==================================================
          # RESUMEN FINAL
          # ==================================================

          print("=" * 70)

          print(
              "🏆 TOP OPORTUNIDADES"
          )

          for item in opportunities[:5]:

              print(
                  f"{item['symbol']} | "
                  f"{item['score']:.0f}/100 | "
                  f"{item['timing']} | "
                  f"{item['change30']:+.2f}% | "
                  f"{item['volume']:.1f}x"
              )

          print()

          print(
              f"🧪 Señales evaluadas: "
              f"{total_completed}"
          )

          print(
              f"🎯 +5%: {hit5}"
          )

          print(
              f"🚀 +10%: {hit10}"
          )

          print(
              f"🔥 +15%: {hit15}"
          )

          print()

          print(
              "📁 Archivos:"
          )

          print(
              " - scanner_state.json"
          )

          print(
              " - signal_log.json"
          )

          print(
              "✅ V8 TERMINADA"
          )

          print("=" * 70)

          PY
