name: Momentum Detector

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar datos de Twelve Data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          SYMBOLS = [
              "NVDA",
              "AMD",
              "TSLA",
              "PLTR",
              "COIN",
              "HOOD",
              "MSTR",
              "SMCI"
          ]

          params = urllib.parse.urlencode({
              "symbol": ",".join(SYMBOLS),
              "interval": "1min",
              "outputsize": "61",
              "apikey": API_KEY
          })

          url = (
              "https://api.twelvedata.com/time_series?"
              + params
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "MomentumDetector/1.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              data = json.load(response)

          print()
          print("==========================================")
          print("      RESULTADO TWELVE DATA")
          print("==========================================")
          print()

          for symbol in SYMBOLS:

              if symbol not in data:

                  print(
                      f"❌ {symbol} → NO RECIBIDO"
                  )

                  continue

              symbol_data = data[symbol]

              if "values" not in symbol_data:

                  print(
                      f"⚠️ {symbol} → "
                      "RECIBIDO PERO SIN VELAS"
                  )

                  continue

              values = symbol_data["values"]

              print(
                  f"✅ {symbol} → "
                  f"{len(values)} velas"
              )

          print()
          print("==========================================")
          print("Diagnóstico terminado correctamente.")
          print("==========================================")
          PY
