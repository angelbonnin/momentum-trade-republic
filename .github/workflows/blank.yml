name: Momentum Detector

on:
  workflow_dispatch:

jobs:
  momentum:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar detector
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import json
          import time

          API_KEY = os.environ["FINNHUB_API_KEY"]

          # Primera lista de prueba.
          # Después ampliaremos el universo.
          SYMBOLS = [
              "AAPL",
              "NVDA",
              "AMD",
              "AMZN",
              "TSLA",
              "META",
              "MSFT",
              "GOOGL",
              "NFLX",
              "AVGO"
          ]

          print("🚨 MOMENTUM DETECTOR")
          print("=" * 50)

          for symbol in SYMBOLS:
              try:
                  url = (
                      "https://finnhub.io/api/v1/quote"
                      f"?symbol={symbol}&token={API_KEY}"
                  )

                  with urllib.request.urlopen(url, timeout=10) as response:
                      data = json.load(response)

                  price = data.get("c")
                  change = data.get("dp")

                  if price is None or change is None:
                      print(f"{symbol}: sin datos")
                      continue

                  print(
                      f"{symbol}: ${price:.2f} | "
                      f"cambio diario: {change:.2f}%"
                  )

                  if change >= 10:
                      print(
                          f"🚨 MOMENTUM DETECTADO: "
                          f"{symbol} +{change:.2f}%"
                      )

                  time.sleep(0.2)

              except Exception as e:
                  print(f"{symbol}: ERROR - {e}")

          print("=" * 50)
          print("Escaneo terminado.")
          PY
