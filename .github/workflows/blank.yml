name: Momentum Detector

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  momentum:
    runs-on: ubuntu-latest

    steps:
      - name: Escanear acciones y enviar alertas
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json
          import time

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]
          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          SYMBOLS = [
              "NVDA",
              "AMD",
              "TSLA",
              "PLTR",
              "COIN",
              "HOOD",
              "MSTR",
              "SMCI"
          ]

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": message
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=data
              )

              with urllib.request.urlopen(request, timeout=15) as response:
                  return response.read().decode()

          print("🚨 MOMENTUM DETECTOR")
          print("=" * 60)

          alerts = 0
          errors = 0

          for symbol in SYMBOLS:

              try:
                  # Esperamos entre peticiones para evitar HTTP 429
                  time.sleep(8)

                  params = urllib.parse.urlencode({
                      "symbol": symbol,
                      "interval": "1min",
                      "outputsize": "61",
                      "apikey": API_KEY
                  })

                  url = (
                      "https://api.twelvedata.com/time_series?"
                      + params
                  )

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "MomentumDetector/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:
                      data = json.load(response)

                  if "values" not in data:
                      print(
                          f"⚠️ {symbol}: "
                          f"sin datos disponibles"
                      )
                      errors += 1
                      continue

                  values = data["values"]

                  if len(values) < 61:
                      print(
                          f"⚠️ {symbol}: "
                          f"datos insuficientes "
                          f"({len(values)} velas)"
                      )
                      errors += 1
                      continue

                  current_price = float(
                      values[0]["close"]
                  )

                  old_price = float(
                      values[60]["close"]
                  )

                  change = (
                      (current_price - old_price)
                      / old_price
                  ) * 100

                  print(
                      f"{symbol}: "
                      f"${current_price:.2f} | "
                      f"60 min: {change:+.2f}%"
                  )

                  if change >= 10:

                      message = (
                          "🚨 MOMENTUM DETECTADO 🚨\n\n"
                          f"📈 Acción: {symbol}\n"
                          f"💰 Precio: ${current_price:.2f}\n"
                          f"📊 Movimiento 60 min: "
                          f"+{change:.2f}%\n\n"
                          "⚠️ No es una recomendación "
                          "automática de compra."
                      )

                      try:
                          send_telegram(message)

                          print(
                              f"📱 ALERTA ENVIADA: {symbol}"
                          )

                          alerts += 1

                      except Exception as telegram_error:
                          print(
                              f"❌ Error Telegram "
                              f"{symbol}: "
                              f"{telegram_error}"
                          )

              except Exception as e:
                  print(
                      f"⚠️ {symbol}: "
                      f"datos no disponibles ({e})"
                  )
                  errors += 1
                  continue

          print("=" * 60)
          print(
              f"Alertas enviadas: {alerts}"
          )
          print(
              f"Acciones con errores: {errors}"
          )
          print("Escaneo terminado.")
          PY
