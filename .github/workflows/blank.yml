name: Momentum Detector

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  momentum:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: momentum_state.json
          key: momentum-state-${{ github.run_id }}
          restore-keys: |
            momentum-state-

      - name: Ejecutar detector
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]
          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          run_number = int(
              os.environ.get("RUN_NUMBER", "1")
          )

          GROUPS = [
              ["NVDA", "AMD", "TSLA", "PLTR", "COIN", "HOOD", "MSTR", "SMCI"],
              ["APP", "ARM", "AVGO", "MU", "MRVL", "TSM", "QCOM", "INTC"],
              ["AMZN", "META", "NFLX", "GOOG", "GOOGL", "AAPL", "MSFT", "AMAT"],
              ["LRCX", "CRWD", "PANW", "SNOW", "DDOG", "NET", "RBLX", "SHOP"],
              ["UBER", "ABNB", "MELI", "CVNA", "RIVN", "NIO", "SOFI", "MARA"]
          ]

          group_index = (run_number - 1) % 5
          symbols = GROUPS[group_index]

          # ------------------------------------------
          # CARGAR ESTADO
          # ------------------------------------------

          state_file = "momentum_state.json"

          try:

              with open(state_file, "r") as f:
                  state = json.load(f)

          except:

              state = {}

          print("=" * 60)
          print("🚨 MOMENTUM DETECTOR")
          print("=" * 60)
          print(f"Grupo: {group_index + 1}/5")
          print("Acciones:", ", ".join(symbols))
          print("=" * 60)

          def send_telegram(message):

              url = (
                  f"https://api.telegram.org/"
                  f"bot{BOT_TOKEN}/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": message
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=data
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  return response.read().decode()

          # ------------------------------------------
          # TWELVE DATA
          # ------------------------------------------

          params = urllib.parse.urlencode({
              "symbol": ",".join(symbols),
              "interval": "1min",
              "outputsize": "61",
              "apikey": API_KEY
          })

          url = (
              "https://api.twelvedata.com/time_series?"
              + params
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "MomentumDetector/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.load(response)

          except Exception as error:

              print("❌ Error Twelve Data:")
              print(error)
              raise SystemExit(1)

          alerts = 0
          errors = 0

          # ------------------------------------------
          # ANALIZAR
          # ------------------------------------------

          for symbol in symbols:

              try:

                  if symbol not in data:

                      print(
                          f"❌ {symbol}: "
                          "no recibido"
                      )

                      errors += 1
                      continue

                  symbol_data = data[symbol]

                  if "values" not in symbol_data:

                      print(
                          f"❌ {symbol}: "
                          "sin velas"
                      )

                      errors += 1
                      continue

                  values = symbol_data["values"]

                  if len(values) < 61:

                      print(
                          f"❌ {symbol}: "
                          "datos insuficientes"
                      )

                      errors += 1
                      continue

                  # PRECIO

                  current_price = float(
                      values[0]["close"]
                  )

                  old_price = float(
                      values[60]["close"]
                  )

                  change = (
                      (
                          current_price
                          - old_price
                      )
                      / old_price
                  ) * 100

                  # VOLUMEN

                  volumes = []

                  for candle in values:

                      if "volume" in candle:

                          try:

                              volumes.append(
                                  float(candle["volume"])
                              )

                          except:

                              pass

                  if len(volumes) >= 2:

                      current_volume = volumes[0]

                      historical = volumes[1:]

                      average_volume = (
                          sum(historical)
                          / len(historical)
                      )

                      if average_volume > 0:

                          volume_ratio = (
                              current_volume
                              / average_volume
                          )

                      else:

                          volume_ratio = 0

                  else:

                      volume_ratio = 0

                  print(
                      f"{symbol}: "
                      f"${current_price:.2f} | "
                      f"60m: {change:+.2f}% | "
                      f"Vol: {volume_ratio:.1f}x"
                  )

                  # --------------------------------
                  # CONDICIONES
                  # --------------------------------

                  momentum = (
                      change >= 10
                      and volume_ratio >= 3
                  )

                  already_alerted = (
                      state.get(symbol, False)
                  )

                  # --------------------------------
                  # NUEVA ALERTA
                  # --------------------------------

                  if momentum:

                      if not already_alerted:

                          message = (
                              "🚨 MOMENTUM DETECTADO 🚨\n\n"
                              f"📈 {symbol}\n"
                              f"💰 ${current_price:.2f}\n"
                              f"📊 +{change:.2f}% "
                              "en 60 minutos\n"
                              f"🔥 Volumen: "
                              f"{volume_ratio:.1f}x\n\n"
                              "⚠️ Señal de momentum. "
                              "No es recomendación "
                              "automática de compra."
                          )

                          try:

                              send_telegram(
                                  message
                              )

                              print(
                                  f"📱 NUEVA ALERTA: "
                                  f"{symbol}"
                              )

                              state[symbol] = True
                              alerts += 1

                          except Exception as error:

                              print(
                                  f"❌ Telegram: "
                                  f"{error}"
                              )

                      else:

                          print(
                              f"🔕 {symbol}: "
                              "alerta ya enviada"
                          )

                  # --------------------------------
                  # LIBERAR ALERTA
                  # --------------------------------

                  else:

                      if already_alerted:

                          state[symbol] = False

                          print(
                              f"🔄 {symbol}: "
                              "momentum finalizado"
                          )

              except Exception as error:

                  print(
                      f"⚠️ {symbol}: "
                      f"{error}"
                  )

                  errors += 1

          # ------------------------------------------
          # GUARDAR ESTADO
          # ------------------------------------------

          with open(state_file, "w") as f:

              json.dump(
                  state,
                  f,
                  indent=2
              )

          print("=" * 60)
          print(f"Alertas nuevas: {alerts}")
          print(f"Errores: {errors}")
          print("Estado guardado")
          print("Escaneo terminado")
          print("=" * 60)

          PY

      - name: Guardar estado
        uses: actions/cache/save@v4
        with:
          path: momentum_state.json
          key: momentum-state-${{ github.run_id }}
