name: Opportunity Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: opportunity-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Opportunity Scanner V8
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |
          python - <<'PY'

          import os
          import json
          import urllib.parse
          import urllib.request
          import subprocess
          from datetime import datetime, timezone, timedelta


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          TD = os.environ["TWELVE_DATA_API_KEY"]
          MX = os.environ["MARKETAUX_API_KEY"]
          BOT = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT = os.environ["TELEGRAM_CHAT_ID"]

          RUN_NUMBER = int(
              os.environ.get("RUN_NUMBER", "1")
          )

          STATE_FILE = "scanner_state.json"
          SIGNAL_FILE = "signal_log.json"


          # ============================================================
          # UNIVERSO DE ACCIONES
          # ============================================================

          groups = [

              [
                  "NVDA", "AMD", "AVGO", "MU",
                  "MRVL", "ARM", "SMCI", "INTC"
              ],

              [
                  "TSLA", "PLTR", "APP", "HOOD",
                  "COIN", "MSTR", "MARA", "RIVN"
              ],

              [
                  "META", "AMZN", "NFLX", "GOOG",
                  "GOOGL", "AAPL", "MSFT", "ORCL"
              ],

              [
                  "CRWD", "PANW", "SNOW", "DDOG",
                  "NET", "RBLX", "SHOP", "U"
              ],

              [
                  "UBER", "ABNB", "CVNA", "SOFI",
                  "NIO", "LI", "XPEV", "BABA"
              ],

              [
                  "JPM", "BAC", "GS", "MS",
                  "C", "WFC", "V", "MA"
              ],

              [
                  "MRNA", "PFE", "LLY", "BNTX",
                  "REGN", "VRTX", "GILD", "BIIB"
              ],

              [
                  "XOM", "CVX", "OXY", "SLB",
                  "COP", "FANG", "MPC", "VLO"
              ],

              [
                  "BA", "GE", "CAT", "DE",
                  "LMT", "RTX", "NOC", "GD"
              ],

              [
                  "T", "VZ", "TMUS", "CMCSA",
                  "DIS", "WBD", "TGT", "COST"
              ]

          ]

          group_index = (
              (RUN_NUMBER - 1)
              % len(groups)
          )

          symbols = groups[group_index]

          now = datetime.now(timezone.utc)


          print("=" * 70)
          print("OPPORTUNITY SCANNER V8")
          print("=" * 70)
          print(
              "Grupo:",
              group_index + 1,
              "/",
              len(groups)
          )
          print(
              "Acciones:",
              ", ".join(symbols)
          )


          # ============================================================
          # CARGAR MEMORIA
          # ============================================================

          try:

              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  state = json.load(f)

          except Exception:

              state = {}


          if not isinstance(state, dict):

              state = {}


          # ============================================================
          # CARGAR HISTORIAL DE SEÑALES
          # ============================================================

          try:

              with open(
                  SIGNAL_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  signals = json.load(f)

          except Exception:

              signals = []


          if not isinstance(signals, list):

              signals = []


          # ============================================================
          # TELEGRAM
          # ============================================================

          def telegram(message):

              url = (
                  "https://api.telegram.org/"
                  "bot"
                  + BOT
                  + "/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": CHAT,
                  "text": message
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=data
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  return response.read()


          # ============================================================
          # TWELVE DATA
          # ============================================================

          def get_market_data():

              params = urllib.parse.urlencode({

                  "symbol":
                      ",".join(symbols),

                  "interval":
                      "1min",

                  "outputsize":
                      "391",

                  "apikey":
                      TD

              })

              url = (
                  "https://api.twelvedata.com/"
                  "time_series?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "OpportunityScanner/8.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  return json.load(response)


          try:

              market = get_market_data()

          except Exception as error:

              print("ERROR TWELVE DATA:")
              print(error)

              raise SystemExit(1)


          # ============================================================
          # PALABRAS DE CATALIZADOR
          # ============================================================

          strong_keywords = [

              "fda",
              "approval",
              "approved",
              "clinical trial",
              "clinical results",
              "phase 1",
              "phase 2",
              "phase 3",
              "positive results",
              "earnings",
              "quarterly results",
              "guidance",
              "acquisition",
              "acquire",
              "merger",
              "contract",
              "major contract",
              "partnership",
              "agreement",
              "deal",
              "regulatory",
              "buyback",
              "share repurchase",
              "product launch"

          ]


          medium_keywords = [

              "upgrade",
              "downgrade",
              "price target",
              "analyst",
              "expansion",
              "collaboration",
              "investment",
              "forecast",
              "outlook"

          ]


          def classify_news(article):

              text = " ".join([

                  str(
                      article.get(
                          "title",
                          ""
                      )
                  ),

                  str(
                      article.get(
                          "description",
                          ""
                      )
                  ),

                  str(
                      article.get(
                          "snippet",
                          ""
                      )
                  )

              ]).lower()


              strong_hits = [

                  keyword

                  for keyword
                  in strong_keywords

                  if keyword in text

              ]


              medium_hits = [

                  keyword

                  for keyword
                  in medium_keywords

                  if keyword in text

              ]


              if strong_hits:

                  return (
                      "FUERTE",
                      25,
                      strong_hits
                  )


              if medium_hits:

                  return (
                      "MEDIO",
                      12,
                      medium_hits
                  )


              return (
                  "NINGUNO",
                  0,
                  []
              )


          # ============================================================
          # EVALUAR SEÑALES ANTERIORES
          # ============================================================

          completed_updates = 0


          for signal in signals:

              if signal.get(
                  "completed",
                  False
              ):

                  continue


              symbol = signal.get(
                  "symbol"
              )


              if symbol not in market:

                  continue


              data = market.get(
                  symbol,
                  {}
              )


              candles = data.get(
                  "values",
                  []
              )


              if not candles:

                  continue


              try:

                  entry_time = datetime.fromisoformat(
                      signal["timestamp"]
                  )

                  entry_price = float(
                      signal["entry_price"]
                  )

              except Exception:

                  continue


              # --------------------------------------------------------
              # Buscar velas posteriores a la señal
              # --------------------------------------------------------

              future = []


              for candle in candles:

                  try:

                      candle_time = datetime.fromisoformat(
                          candle["datetime"]
                      )

                      if (
                          candle_time
                          > entry_time
                      ):

                          future.append({
                              "time":
                                  candle_time,

                              "high":
                                  float(
                                      candle["high"]
                                  ),

                              "low":
                                  float(
                                      candle["low"]
                                  ),

                              "close":
                                  float(
                                      candle["close"]
                                  )
                          })

                  except Exception:

                      continue


              if not future:

                  continue


              # --------------------------------------------------------
              # Datos disponibles hasta ahora
              # --------------------------------------------------------

              elapsed = (
                  now - entry_time
              ).total_seconds() / 60


              highs = [
                  item["high"]
                  for item in future
              ]


              lows = [
                  item["low"]
                  for item in future
              ]


              if highs:

                  maximum = max(highs)

                  max_gain = (
                      (
                          maximum
                          -
                          entry_price
                      )
                      /
                      entry_price
                  ) * 100

                  signal["max_gain"] = round(
                      max_gain,
                      2
                  )


              if lows:

                  minimum = min(lows)

                  max_drawdown = (
                      (
                          minimum
                          -
                          entry_price
                      )
                      /
                      entry_price
                  ) * 100

                  signal["max_drawdown"] = round(
                      max_drawdown,
                      2
                  )


              # --------------------------------------------------------
              # Objetivos
              # --------------------------------------------------------

              signal["hit_5"] = (
                  signal.get(
                      "max_gain",
                      0
                  ) >= 5
              )


              signal["hit_10"] = (
                  signal.get(
                      "max_gain",
                      0
                  ) >= 10
              )


              signal["hit_15"] = (
                  signal.get(
                      "max_gain",
                      0
                  ) >= 15
              )


              # --------------------------------------------------------
              # Finalizar después de 60 minutos
              # --------------------------------------------------------

              if elapsed >= 60:

                  signal["completed"] = True

                  signal["completed_at"] = (
                      now.isoformat()
                  )

                  completed_updates += 1


          # ============================================================
          # ANALIZAR MERCADO ACTUAL
          # ============================================================

          opportunities = []

          errors = 0


          for symbol in symbols:

              try:

                  data = market.get(
                      symbol,
                      {}
                  )


                  candles = data.get(
                      "values",
                      []
                  )


                  if len(candles) < 61:

                      print(
                          symbol,
                          "sin suficientes velas"
                      )

                      continue


                  # ----------------------------------------------------
                  # PRECIOS
                  # ----------------------------------------------------

                  current = float(
                      candles[0]["close"]
                  )

                  p5 = float(
                      candles[5]["close"]
                  )

                  p15 = float(
                      candles[15]["close"]
                  )

                  p30 = float(
                      candles[30]["close"]
                  )

                  p60 = float(
                      candles[60]["close"]
                  )


                  change5 = (
                      (
                          current
                          -
                          p5
                      )
                      /
                      p5
                  ) * 100


                  change15 = (
                      (
                          current
                          -
                          p15
                      )
                      /
                      p15
                  ) * 100


                  change30 = (
                      (
                          current
                          -
                          p30
                      )
                      /
                      p30
                  ) * 100


                  change60 = (
                      (
                          current
                          -
                          p60
                      )
                      /
                      p60
                  ) * 100


                  # ----------------------------------------------------
                  # ACELERACIÓN
                  # ----------------------------------------------------

                  move_old = (
                      (
                          p15
                          -
                          p30
                      )
                      /
                      p30
                  ) * 100


                  move_recent = (
                      (
                          current
                          -
                          p15
                      )
                      /
                      p15
                  ) * 100


                  acceleration = (
                      move_recent
                      -
                      move_old
                  )


                  # ----------------------------------------------------
                  # VOLUMEN
                  # ----------------------------------------------------

                  volumes = []


                  for candle in candles:

                      try:

                          volumes.append(
                              float(
                                  candle["volume"]
                              )
                          )

                      except Exception:

                          pass


                  if len(volumes) >= 10:

                      average_volume = (
                          sum(
                              volumes[1:]
                          )
                          /
                          len(
                              volumes[1:]
                          )
                      )


                      if average_volume > 0:

                          volume_ratio = (
                              volumes[0]
                              /
                              average_volume
                          )

                      else:

                          volume_ratio = 0

                  else:

                      volume_ratio = 0


                  # ----------------------------------------------------
                  # MÁXIMO
                  # ----------------------------------------------------

                  highs = []


                  for candle in candles:

                      try:

                          highs.append(
                              float(
                                  candle["high"]
                              )
                          )

                      except Exception:

                          pass


                  if highs:

                      highest = max(
                          highs
                      )

                  else:

                      highest = current


                  distance_high = (
                      (
                          highest
                          -
                          current
                      )
                      /
                      highest
                  ) * 100


                  # ----------------------------------------------------
                  # SCORE
                  # ----------------------------------------------------

                  score = 0


                  if change30 >= 3:

                      score += 20


                  if change30 >= 5:

                      score += 10


                  if volume_ratio >= 3:

                      score += 15


                  if volume_ratio >= 5:

                      score += 10


                  if volume_ratio >= 8:

                      score += 5


                  if acceleration > 0:

                      score += 10


                  if acceleration >= 2:

                      score += 5


                  if distance_high <= 1:

                      score += 5


                  # ----------------------------------------------------
                  # TIMING
                  # ----------------------------------------------------

                  if change30 >= 10:

                      timing = "EXTENDED"

                  elif change30 >= 7:

                      timing = "LATE"

                  elif (
                      change30 >= 3
                      and
                      acceleration > 1
                      and
                      volume_ratio >= 3
                  ):

                      timing = "EARLY"

                  elif change30 >= 3:

                      timing = "MOMENTUM"

                  else:

                      timing = "NORMAL"


                  # ----------------------------------------------------
                  # MEMORIA
                  # ----------------------------------------------------

                  previous = state.get(
                      symbol,
                      {}
                  )


                  previous_score = float(
                      previous.get(
                          "score",
                          0
                      )
                  )


                  previous_volume = float(
                      previous.get(
                          "volume_ratio",
                          0
                      )
                  )


                  previous_change = float(
                      previous.get(
                          "change30",
                          0
                      )
                  )


                  previous_timing = previous.get(
                      "timing",
                      "NORMAL"
                  )


                  score_delta = (
                      score
                      -
                      previous_score
                  )


                  volume_delta = (
                      volume_ratio
                      -
                      previous_volume
                  )


                  price_delta = (
                      change30
                      -
                      previous_change
                  )


                  accelerating = (

                      score_delta >= 10

                      or

                      volume_delta >= 1.5

                      or

                      price_delta >= 1

                  )


                  state_change = (

                      previous_timing
                      !=
                      timing

                      and

                      timing
                      !=
                      "NORMAL"

                  )


                  # ----------------------------------------------------
                  # PENALIZACIÓN
                  # ----------------------------------------------------

                  adjusted_score = score


                  if timing == "LATE":

                      adjusted_score -= 10


                  elif timing == "EXTENDED":

                      adjusted_score -= 20


                  adjusted_score = max(
                      0,
                      adjusted_score
                  )


                  # ----------------------------------------------------
                  # FILTRO
                  # ----------------------------------------------------

                  if not (
                      change30 >= 3
                      and
                      volume_ratio >= 3
                      and
                      adjusted_score >= 45
                  ):

                      state[symbol] = {

                          "score":
                              score,

                          "volume_ratio":
                              volume_ratio,

                          "change30":
                              change30,

                          "timing":
                              timing,

                          "updated":
                              now.isoformat(),

                          "last_alert":
                              previous.get(
                                  "last_alert",
                                  ""
                              )

                      }

                      continue


                  # ----------------------------------------------------
                  # MARKET AUX
                  # ----------------------------------------------------

                  articles = []

                  news_bonus = 0

                  category = "NINGUNO"

                  best_article = None

                  news_hits = []


                  after = (
                      now
                      -
                      timedelta(hours=3)
                  ).strftime(
                      "%Y-%m-%dT%H:%M"
                  )


                  news_params = urllib.parse.urlencode({

                      "api_token":
                          MX,

                      "symbols":
                          symbol,

                      "filter_entities":
                          "true",

                      "must_have_entities":
                          "true",

                      "language":
                          "en",

                      "limit":
                          "5",

                      "published_after":
                          after,

                      "sort":
                          "published_at"

                  })


                  news_url = (
                      "https://api.marketaux.com/"
                      "v1/news/all?"
                      + news_params
                  )


                  try:

                      news_request = (
                          urllib.request.Request(
                              news_url,
                              headers={
                                  "User-Agent":
                                  "OpportunityScanner/8.0"
                              }
                          )
                      )


                      with urllib.request.urlopen(
                          news_request,
                          timeout=30
                      ) as response:

                          news_data = json.load(
                              response
                          )


                      articles = news_data.get(
                          "data",
                          []
                      )


                  except Exception as error:

                      print(
                          "News error",
                          symbol,
                          error
                      )


                  for article in articles:

                      (
                          news_type,
                          bonus,
                          hits
                      ) = classify_news(
                          article
                      )


                      if bonus > news_bonus:

                          news_bonus = bonus

                          category = news_type

                          best_article = article

                          news_hits = hits


                  # ----------------------------------------------------
                  # SCORE FINAL
                  # ----------------------------------------------------

                  final_score = min(
                      100,
                      adjusted_score
                      +
                      news_bonus
                  )


                  if final_score >= 90:

                      level = "EXCEPCIONAL"

                  elif final_score >= 80:

                      level = "MUY FUERTE"

                  elif final_score >= 70:

                      level = "FUERTE"

                  elif final_score >= 55:

                      level = "INTERESANTE"

                  else:

                      level = "VIGILAR"


                  # ----------------------------------------------------
                  # CANDIDATA
                  # ----------------------------------------------------

                  opportunity = {

                      "symbol":
                          symbol,

                      "score":
                          final_score,

                      "timing":
                          timing,

                      "price":
                          current,

                      "change5":
                          change5,

                      "change15":
                          change15,

                      "change30":
                          change30,

                      "change60":
                          change60,

                      "volume":
                          volume_ratio,

                      "acceleration":
                          acceleration,

                      "category":
                          category,

                      "news_bonus":
                          news_bonus,

                      "accelerating":
                          accelerating,

                      "state_change":
                          state_change,

                      "level":
                          level,

                      "title":
                          (
                              best_article.get(
                                  "title",
                                  ""
                              )
                              if best_article
                              else ""
                          ),

                      "source":
                          (
                              best_article.get(
                                  "source",
                                  ""
                              )
                              if best_article
                              else ""
                          ),

                      "url":
                          (
                              best_article.get(
                                  "url",
                                  ""
                              )
                              if best_article
                              else ""
                          )

                  }


                  opportunities.append(
                      opportunity
                  )


                  # ----------------------------------------------------
                  # COOLDOWN
                  # ----------------------------------------------------

                  last_alert_text = (
                      previous.get(
                          "last_alert",
                          ""
                      )
                  )


                  cooldown_ok = True


                  if last_alert_text:

                      try:

                          last_alert = (
                              datetime.fromisoformat(
                                  last_alert_text
                              )
                          )


                          minutes_since = (
                              (
                                  now
                                  -
                                  last_alert
                              ).total_seconds()
                              / 60
                          )


                          if minutes_since < 60:

                              cooldown_ok = False


                      except Exception:

                          pass


                  # ----------------------------------------------------
                  # DECISIÓN DE ALERTA
                  # ----------------------------------------------------

                  important = (

                      final_score >= 70

                      and

                      (
                          accelerating
                          or
                          state_change
                          or
                          news_bonus >= 25
                      )

                      and

                      timing != "EXTENDED"

                  )


                  if important and cooldown_ok:

                      signal = {

                          "id":
                              (
                                  symbol
                                  +
                                  "_"
                                  +
                                  now.isoformat()
                              ),

                          "symbol":
                              symbol,

                          "timestamp":
                              now.isoformat(),

                          "entry_price":
                              current,

                          "score":
                              final_score,

                          "timing":
                              timing,

                          "volume":
                              volume_ratio,

                          "acceleration":
                              acceleration,

                          "change30":
                              change30,

                          "category":
                              category,

                          "news_bonus":
                              news_bonus,

                          "completed":
                              False,

                          "hit_5":
                              False,

                          "hit_10":
                              False,

                          "hit_15":
                              False

                      }


                      signals.append(
                          signal
                      )


                      # ------------------------------------------------
                      # MENSAJE TELEGRAM
                      # ------------------------------------------------

                      message = (
                          "🚨 NUEVA SEÑAL V8\n\n"

                          "📈 "
                          + symbol
                          + "\n"

                          "🎯 Score: "
                          + str(
                              int(
                                  final_score
                              )
                          )
                          + "/100\n"

                          "🏷 "
                          + level
                          + "\n\n"

                          "⏱ "
                          + timing
                          + "\n"

                          "💰 $"
                          + f"{current:.2f}"
                          + "\n"

                          "📊 30m: "
                          + f"{change30:+.2f}%"
                          + "\n"

                          "🔥 Volumen: "
                          + f"{volume_ratio:.1f}x"
                          + "\n"

                          "⚡ Aceleración: "
                          + f"{acceleration:+.2f}"
                          + "\n\n"

                          "📰 Catalizador: "
                          + category
                          + "\n\n"

                          "🧪 Señal registrada "
                          "para medir el resultado."
                      )


                      if best_article:

                          title = str(
                              best_article.get(
                                  "title",
                                  ""
                              )
                          )


                          if title:

                              message += (
                                  "\n\n"
                                  + title
                              )


                          article_url = str(
                              best_article.get(
                                  "url",
                                  ""
                              )
                          )


                          if article_url:

                              message += (
                                  "\n"
                                  + article_url
                              )


                      try:

                          telegram(
                              message
                          )

                          last_alert_text = (
                              now.isoformat()
                          )

                          print(
                              "ALERTA ENVIADA:",
                              symbol
                          )

                      except Exception as error:

                          print(
                              "Telegram error:",
                              error
                          )


                  # ----------------------------------------------------
                  # GUARDAR ESTADO
                  # ----------------------------------------------------

                  state[symbol] = {

                      "score":
                          adjusted_score,

                      "volume_ratio":
                          volume_ratio,

                      "change30":
                          change30,

                      "timing":
                          timing,

                      "updated":
                          now.isoformat(),

                      "last_alert":
                          last_alert_text

                  }


              except Exception as error:

                  print(
                      "ERROR",
                      symbol,
                      type(error).__name__,
                      error
                  )

                  errors += 1


          # ============================================================
          # ORDENAR OPORTUNIDADES
          # ============================================================

          opportunities.sort(
              key=lambda item:
              item["score"],
              reverse=True
          )


          # ============================================================
          # ESTADÍSTICAS HISTÓRICAS
          # ============================================================

          completed = [

              signal

              for signal
              in signals

              if signal.get(
                  "completed",
                  False
              )

          ]


          total_completed = len(
              completed
          )


          hit5 = sum(

              1

              for signal
              in completed

              if signal.get(
                  "hit_5",
                  False
              )

          )


          hit10 = sum(

              1

              for signal
              in completed

              if signal.get(
                  "hit_10",
                  False
              )

          )


          hit15 = sum(

              1

              for signal
              in completed

              if signal.get(
                  "hit_15",
                  False
              )

          )


          # ============================================================
          # RESUMEN TELEGRAM
          # ============================================================

          summary = (
              "📊 MARKET SCAN V8\n\n"
              "Grupo "
              + str(group_index + 1)
              + "/"
              + str(len(groups))
              + "\n\n"
          )


          if opportunities:

              summary += (
                  "🏆 TOP OPORTUNIDADES\n\n"
              )


              medals = [
                  "🥇",
                  "🥈",
                  "🥉"
              ]


              for index, item in enumerate(
                  opportunities[:5]
              ):

                  if index < 3:

                      medal = medals[index]

                  else:

                      medal = "▪️"


                  summary += (

                      medal
                      + " "
                      + item["symbol"]
                      + " — "
                      + str(
                          int(
                              item["score"]
                          )
                      )
                      + "/100\n"

                      + "   "
                      + item["timing"]
                      + " | "
                      + f"{item['change30']:+.2f}%"
                      + " | Vol "
                      + f"{item['volume']:.1f}x"
                      + "\n"

                  )

          else:

              summary += (
                  "😴 Sin oportunidades "
                  "destacables.\n"
              )


          summary += (
              "\n🧪 RESULTADOS DEL RADAR\n\n"

              "Señales evaluadas: "
              + str(
                  total_completed
              )
              + "\n"

              "🎯 +5%: "
              + str(hit5)
              + "\n"

              "🚀 +10%: "
              + str(hit10)
              + "\n"

              "🔥 +15%: "
              + str(hit15)
              + "\n"
          )


          if total_completed > 0:

              summary += (

                  "\n📈 Tasa +5%: "
                  + f"{hit5 / total_completed * 100:.1f}%"

                  + "\n📈 Tasa +10%: "
                  + f"{hit10 / total_completed * 100:.1f}%"

                  + "\n📈 Tasa +15%: "
                  + f"{hit15 / total_completed * 100:.1f}%"

              )


          summary += (

              "\n\n📡 Acciones: "
              + str(
                  len(symbols)
              )

              + "\n🔎 Candidatas: "
              + str(
                  len(opportunities)
              )

              + "\n⚠️ Errores: "
              + str(
                  errors
              )

              + "\n🧠 Memoria actualizada."

          )


          try:

              telegram(
                  summary
              )

              print(
                  "Resumen Telegram enviado"
              )

          except Exception as error:

              print(
                  "Error enviando resumen:",
                  error
              )


          # ============================================================
          # LIMITAR HISTORIAL
          # ============================================================

          if len(signals) > 500:

              signals = signals[-500:]


          # ============================================================
          # GUARDAR MEMORIA
          # ============================================================

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          with open(
              SIGNAL_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  signals,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ============================================================
          # GIT
          # ============================================================

          try:

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]"
                  ],
                  check=True
              )


              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )


              subprocess.run(
                  [
                      "git",
                      "add",
                      STATE_FILE,
                      SIGNAL_FILE
                  ],
                  check=True
              )


              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )


              if result.returncode != 0:

                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Update scanner V8 data"
                      ],
                      check=True
                  )


                  subprocess.run(
                      [
                          "git",
                          "push"
                      ],
                      check=True
                  )


                  print(
                      "Memoria guardada"
                  )


              else:

                  print(
                      "Sin cambios que guardar"
                  )


          except Exception as error:

              print(
                  "Error Git:",
                  error
              )


          # ============================================================
          # RESULTADO FINAL
          # ============================================================

          print("=" * 70)

          print(
              "TOP OPORTUNIDADES"
          )


          for item in opportunities[:5]:

              print(

                  item["symbol"]
                  + " | "
                  + str(
                      int(
                          item["score"]
                      )
                  )
                  + "/100 | "
                  + item["timing"]
                  + " | "
                  + f"{item['change30']:+.2f}%"
                  + " | Vol "
                  + f"{item['volume']:.1f}x"

              )


          print()

          print(
              "Señales evaluadas:",
              total_completed
          )

          print(
              "+5%:",
              hit5
          )

          print(
              "+10%:",
              hit10
          )

          print(
              "+15%:",
              hit15
          )

          print()

          print(
              "V8 TERMINADA"
          )

          print("=" * 70)

          PY
