name: Opportunity Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 13-19 * * 1-5"

permissions:
  contents: write

concurrency:
  group: opportunity-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Opportunity Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json
          import subprocess
          from datetime import datetime, timezone, timedelta

          TD = os.environ["TWELVE_DATA_API_KEY"]
          MX = os.environ["MARKETAUX_API_KEY"]
          BOT = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT = os.environ["TELEGRAM_CHAT_ID"]

          run = int(
              os.environ.get("RUN_NUMBER", "1")
          )

          # ==================================================
          # UNIVERSO
          # ==================================================

          groups = [

              [
                  "NVDA","AMD","AVGO","MU",
                  "MRVL","ARM","SMCI","INTC"
              ],

              [
                  "TSLA","PLTR","APP","HOOD",
                  "COIN","MSTR","MARA","RIVN"
              ],

              [
                  "META","AMZN","NFLX","GOOG",
                  "GOOGL","AAPL","MSFT","ORCL"
              ],

              [
                  "CRWD","PANW","SNOW","DDOG",
                  "NET","RBLX","SHOP","U"
              ],

              [
                  "UBER","ABNB","CVNA","SOFI",
                  "NIO","LI","XPEV","BABA"
              ],

              [
                  "JPM","BAC","GS","MS",
                  "C","WFC","V","MA"
              ],

              [
                  "MRNA","PFE","LLY","BNTX",
                  "REGN","VRTX","GILD","BIIB"
              ],

              [
                  "XOM","CVX","OXY","SLB",
                  "COP","FANG","MPC","VLO"
              ],

              [
                  "BA","GE","CAT","DE",
                  "LMT","RTX","NOC","GD"
              ],

              [
                  "T","VZ","TMUS","CMCSA",
                  "DIS","WBD","TGT","COST"
              ]

          ]

          group_index = (
              (run - 1) % len(groups)
          )

          symbols = groups[group_index]

          print("=" * 70)
          print("🚨 OPPORTUNITY SCANNER V6")
          print("=" * 70)

          print(
              f"Grupo {group_index + 1}/"
              f"{len(groups)}"
          )

          print(
              "Acciones:",
              ", ".join(symbols)
          )

          # ==================================================
          # MEMORIA
          # ==================================================

          STATE_FILE = "scanner_state.json"

          try:

              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  state = json.load(f)

          except:

              state = {}

          if not isinstance(state, dict):

              state = {}

          now = datetime.now(
              timezone.utc
          )

          # ==================================================
          # TELEGRAM
          # ==================================================

          def telegram(message):

              url = (
                  "https://api.telegram.org/"
                  f"bot{BOT}/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": CHAT,
                  "text": message
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=data
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as r:

                  return r.read()

          # ==================================================
          # TWELVE DATA
          # ==================================================

          params = urllib.parse.urlencode({
              "symbol": ",".join(symbols),
              "interval": "1min",
              "outputsize": "61",
              "apikey": TD
          })

          url = (
              "https://api.twelvedata.com/time_series?"
              + params
          )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "OpportunityScanner/6.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as r:

                  market = json.load(r)

          except Exception as e:

              print("❌ ERROR TWELVE DATA")
              print(e)

              raise SystemExit(1)

          candidates = 0
          alerts = 0
          errors = 0

          # ==================================================
          # CATALIZADORES
          # ==================================================

          strong = [
              "fda",
              "approval",
              "approved",
              "clinical trial",
              "clinical results",
              "phase 1",
              "phase 2",
              "phase 3",
              "positive results",
              "earnings",
              "quarterly results",
              "guidance",
              "acquisition",
              "acquire",
              "merger",
              "contract",
              "major contract",
              "partnership",
              "agreement",
              "deal",
              "regulatory",
              "buyback",
              "share repurchase",
              "product launch"
          ]

          medium = [
              "upgrade",
              "downgrade",
              "price target",
              "analyst",
              "expansion",
              "collaboration",
              "investment",
              "forecast",
              "outlook"
          ]

          def classify(article):

              text = " ".join([
                  str(article.get("title", "")),
                  str(article.get("description", "")),
                  str(article.get("snippet", ""))
              ]).lower()

              strong_hits = [
                  x for x in strong
                  if x in text
              ]

              medium_hits = [
                  x for x in medium
                  if x in text
              ]

              if strong_hits:

                  return (
                      "🔴 MUY FUERTE",
                      25,
                      strong_hits
                  )

              if medium_hits:

                  return (
                      "🟠 MEDIO",
                      12,
                      medium_hits
                  )

              return (
                  "⚪ DÉBIL",
                  0,
                  []
              )

          # ==================================================
          # ANALISIS
          # ==================================================

          for symbol in symbols:

              try:

                  if symbol not in market:

                      print(
                          f"❌ {symbol}: "
                          "sin datos"
                      )

                      errors += 1
                      continue

                  data = market[symbol]

                  if "values" not in data:

                      print(
                          f"❌ {symbol}: "
                          "sin velas"
                      )

                      errors += 1
                      continue

                  candles = data["values"]

                  if len(candles) < 61:

                      continue

                  # ==================================================
                  # PRECIOS
                  # ==================================================

                  current = float(
                      candles[0]["close"]
                  )

                  p5 = float(
                      candles[5]["close"]
                  )

                  p15 = float(
                      candles[15]["close"]
                  )

                  p30 = float(
                      candles[30]["close"]
                  )

                  p60 = float(
                      candles[60]["close"]
                  )

                  change5 = (
                      (current - p5)
                      / p5
                  ) * 100

                  change15 = (
                      (current - p15)
                      / p15
                  ) * 100

                  change30 = (
                      (current - p30)
                      / p30
                  ) * 100

                  change60 = (
                      (current - p60)
                      / p60
                  ) * 100

                  # ==================================================
                  # ACELERACION
                  # ==================================================

                  move_60_30 = (
                      (p30 - p60)
                      / p60
                  ) * 100

                  move_30_15 = (
                      (p15 - p30)
                      / p30
                  ) * 100

                  move_15_0 = (
                      (current - p15)
                      / p15
                  ) * 100

                  acceleration = (
                      move_15_0
                      - move_30_15
                  )

                  # ==================================================
                  # MAXIMO
                  # ==================================================

                  highs = []

                  for candle in candles:

                      try:

                          highs.append(
                              float(
                                  candle["high"]
                              )
                          )

                      except:

                          pass

                  high = (
                      max(highs)
                      if highs
                      else current
                  )

                  distance_high = (
                      (high - current)
                      / high
                  ) * 100

                  # ==================================================
                  # VOLUMEN
                  # ==================================================

                  volumes = []

                  for candle in candles:

                      try:

                          volumes.append(
                              float(
                                  candle["volume"]
                              )
                          )

                      except:

                          pass

                  if len(volumes) >= 10:

                      current_volume = volumes[0]

                      average_volume = (
                          sum(volumes[1:])
                          /
                          len(volumes[1:])
                      )

                      if average_volume > 0:

                          volume_ratio = (
                              current_volume
                              /
                              average_volume
                          )

                      else:

                          volume_ratio = 0

                  else:

                      volume_ratio = 0

                  # ==================================================
                  # SCORE TECNICO
                  # ==================================================

                  score = 0

                  if change30 >= 3:
                      score += 20

                  if change30 >= 5:
                      score += 10

                  if volume_ratio >= 3:
                      score += 15

                  if volume_ratio >= 5:
                      score += 10

                  if volume_ratio >= 8:
                      score += 5

                  if acceleration > 0:
                      score += 10

                  if acceleration >= 2:
                      score += 5

                  if distance_high <= 1:
                      score += 5

                  # ==================================================
                  # MOMENTO
                  # ==================================================

                  if change30 >= 10:

                      timing = "🔴 EXTENDED"

                  elif change30 >= 7:

                      timing = "🟠 LATE"

                  elif (
                      change30 >= 3
                      and
                      acceleration > 1
                      and
                      volume_ratio >= 3
                  ):

                      timing = "🟢 EARLY"

                  elif change30 >= 3:

                      timing = "🟡 MOMENTUM"

                  else:

                      timing = "⚪ NORMAL"

                  # ==================================================
                  # ESTADO ANTERIOR
                  # ==================================================

                  previous = state.get(
                      symbol,
                      {}
                  )

                  previous_score = float(
                      previous.get(
                          "score",
                          0
                      )
                  )

                  previous_volume = float(
                      previous.get(
                          "volume_ratio",
                          0
                      )
                  )

                  previous_timing = previous.get(
                      "timing",
                      "⚪ NORMAL"
                  )

                  previous_change30 = float(
                      previous.get(
                          "change30",
                          0
                      )
                  )

                  # ==================================================
                  # CAMBIO DESDE LA EJECUCION ANTERIOR
                  # ==================================================

                  score_delta = (
                      score
                      - previous_score
                  )

                  volume_delta = (
                      volume_ratio
                      - previous_volume
                  )

                  price_delta = (
                      change30
                      - previous_change30
                  )

                  accelerating = (
                      score_delta >= 10
                      or
                      volume_delta >= 1.5
                      or
                      price_delta >= 1.0
                  )

                  # ==================================================
                  # TRANSICION DE ESTADO
                  # ==================================================

                  state_change = False

                  if (
                      previous_timing != timing
                      and
                      timing != "⚪ NORMAL"
                  ):

                      state_change = True

                  if (
                      timing == "🟢 EARLY"
                      and
                      accelerating
                  ):

                      state_change = True

                  # ==================================================
                  # PENALIZACION
                  # ==================================================

                  adjusted_score = score

                  if timing == "🟠 LATE":

                      adjusted_score -= 10

                  elif timing == "🔴 EXTENDED":

                      adjusted_score -= 20

                  if adjusted_score < 0:

                      adjusted_score = 0

                  print(
                      f"{symbol} | "
                      f"30m {change30:+.2f}% | "
                      f"Vol {volume_ratio:.1f}x | "
                      f"{timing} | "
                      f"Score {adjusted_score} | "
                      f"ΔScore {score_delta:+.0f} | "
                      f"Accel "
                      f"{accelerating}"
                  )

                  # ==================================================
                  # FILTRO
                  # ==================================================

                  qualifies = (
                      change30 >= 3
                      and
                      volume_ratio >= 3
                      and
                      adjusted_score >= 45
                  )

                  if not qualifies:

                      # Guardamos igualmente
                      # el estado para la siguiente
                      # ejecución.

                      state[symbol] = {

                          "score": score,

                          "volume_ratio":
                              volume_ratio,

                          "change30":
                              change30,

                          "timing":
                              timing,

                          "updated":
                              now.isoformat(),

                          "last_alert":
                              previous.get(
                                  "last_alert",
                                  ""
                              )

                      }

                      continue

                  candidates += 1

                  print(
                      f"🔎 CANDIDATA: "
                      f"{symbol}"
                  )

                  # ==================================================
                  # MARKETaux
                  # ==================================================

                  after = (
                      datetime.now(
                          timezone.utc
                      )
                      -
                      timedelta(hours=3)
                  ).strftime(
                      "%Y-%m-%dT%H:%M"
                  )

                  news_params = urllib.parse.urlencode({

                      "api_token": MX,

                      "symbols": symbol,

                      "filter_entities":
                          "true",

                      "must_have_entities":
                          "true",

                      "language":
                          "en",

                      "limit":
                          "5",

                      "published_after":
                          after,

                      "sort":
                          "published_at"

                  })

                  news_url = (
                      "https://api.marketaux.com/"
                      "v1/news/all?"
                      + news_params
                  )

                  news_req = urllib.request.Request(
                      news_url,
                      headers={
                          "User-Agent":
                              "OpportunityScanner/6.0"
                      }
                  )

                  articles = []

                  try:

                      with urllib.request.urlopen(
                          news_req,
                          timeout=30
                      ) as r:

                          news_data = json.load(r)

                      articles = news_data.get(
                          "data",
                          []
                      )

                  except Exception as e:

                      print(
                          f"⚠️ Marketaux "
                          f"{symbol}: {e}"
                      )

                  # ==================================================
                  # MEJOR NOTICIA
                  # ==================================================

                  best = None
                  news_bonus = 0
                  category = (
                      "⚪ SIN CATALIZADOR"
                  )
                  hits = []

                  for article in articles:

                      cat, bonus, found = (
                          classify(article)
                      )

                      if bonus > news_bonus:

                          best = article
                          news_bonus = bonus
                          category = cat
                          hits = found

                  # ==================================================
                  # SCORE FINAL
                  # ==================================================

                  final_score = (
                      adjusted_score
                      + news_bonus
                  )

                  if final_score > 100:

                      final_score = 100

                  # ==================================================
                  # NIVEL
                  # ==================================================

                  if final_score >= 90:

                      level = (
                          "🔴 EXCEPCIONAL"
                      )

                  elif final_score >= 80:

                      level = (
                          "🔴 MUY FUERTE"
                      )

                  elif final_score >= 70:

                      level = (
                          "🟠 FUERTE"
                      )

                  elif final_score >= 55:

                      level = (
                          "🟡 INTERESANTE"
                      )

                  else:

                      level = (
                          "⚪ VIGILAR"
                      )

                  # ==================================================
                  # ALERTA NUEVA
                  # ==================================================

                  last_alert_text = previous.get(
                      "last_alert",
                      ""
                  )

                  try:

                      last_alert = (
                          datetime.fromisoformat(
                              last_alert_text
                          )
                          if last_alert_text
                          else None
                      )

                  except:

                      last_alert = None

                  cooldown_ok = True

                  if last_alert:

                      minutes_since = (
                          (
                              now
                              - last_alert
                          ).total_seconds()
                          / 60
                      )

                      if minutes_since < 60:

                          cooldown_ok = False

                  # ==================================================
                  # REGLA DE ALERTA
                  # ==================================================

                  important_alert = (

                      final_score >= 70

                      and

                      (
                          state_change
                          or
                          accelerating
                          or
                          news_bonus >= 25
                      )

                  )

                  # No perseguimos acciones
                  # extremadamente extendidas.

                  if timing == "🔴 EXTENDED":

                      important_alert = False

                  # ==================================================
                  # NOTICIA
                  # ==================================================

                  if best:

                      title = best.get(
                          "title",
                          "Sin título"
                      )

                      source = best.get(
                          "source",
                          "Desconocida"
                      )

                      article_url = best.get(
                          "url",
                          ""
                      )

                  else:

                      title = (
                          "No se detectó "
                          "catalizador reciente."
                      )

                      source = ""
                      article_url = ""

                  # ==================================================
                  # TELEGRAM
                  # ==================================================

                  if important_alert and cooldown_ok:

                      message = (
                          "🚨 ALERTA DE ACELERACIÓN\n\n"

                          f"📈 {symbol}\n"

                          f"🎯 SCORE: "
                          f"{final_score}/100\n"

                          f"{level}\n\n"

                          f"⏱ ESTADO: "
                          f"{timing}\n"

                          f"🔄 ANTERIOR: "
                          f"{previous_timing}\n\n"

                          f"💰 Precio: "
                          f"${current:.2f}\n"

                          f"📊 5 min: "
                          f"{change5:+.2f}%\n"

                          f"📊 15 min: "
                          f"{change15:+.2f}%\n"

                          f"📊 30 min: "
                          f"{change30:+.2f}%\n"

                          f"📊 60 min: "
                          f"{change60:+.2f}%\n\n"

                          f"🔥 Volumen: "
                          f"{volume_ratio:.1f}x\n"

                          f"📈 Volumen anterior: "
                          f"{previous_volume:.1f}x\n"

                          f"⚡ Aceleración: "
                          f"{acceleration:+.2f}\n"

                          f"📈 Distancia máximo: "
                          f"{distance_high:.2f}%\n\n"

                          f"📰 CATALIZADOR: "
                          f"{category}\n"
                      )

                      if best:

                          message += (
                              f"\n{title}\n"
                          )

                          if source:

                              message += (
                                  f"Fuente: "
                                  f"{source}\n"
                              )

                          if hits:

                              message += (
                                  "\n🔎 Detectado: "
                                  +
                                  ", ".join(
                                      hits[:4]
                                  )
                                  +
                                  "\n"
                              )

                          if article_url:

                              message += (
                                  f"\n🔗 "
                                  f"{article_url}\n"
                              )

                      message += (
                          "\n⚠️ Radar de "
                          "oportunidades. "
                          "No es una recomendación "
                          "automática de compra."
                      )

                      try:

                          telegram(message)

                          alerts += 1

                          print(
                              f"📱 ALERTA ENVIADA: "
                              f"{symbol}"
                          )

                      except Exception as e:

                          print(
                              f"❌ TELEGRAM "
                              f"{symbol}: {e}"
                          )

                      current_last_alert = (
                          now.isoformat()
                      )

                  else:

                      current_last_alert = (
                          last_alert_text
                      )

                      if not important_alert:

                          print(
                              f"ℹ️ {symbol}: "
                              "sin nueva alerta"
                          )

                      elif not cooldown_ok:

                          print(
                              f"🔕 {symbol}: "
                              "cooldown activo"
                          )

                  # ==================================================
                  # GUARDAR ESTADO
                  # ==================================================

                  state[symbol] = {

                      "score":
                          adjusted_score,

                      "volume_ratio":
                          volume_ratio,

                      "change30":
                          change30,

                      "timing":
                          timing,

                      "updated":
                          now.isoformat(),

                      "last_alert":
                          current_last_alert

                  }

              except Exception as e:

                  print(
                      f"⚠️ {symbol}: "
                      f"{type(e).__name__}: "
                      f"{e}"
                  )

                  errors += 1

          # ==================================================
          # GUARDAR MEMORIA
          # ==================================================

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ==================================================
          # COMMIT AUTOMATICO
          # ==================================================

          try:

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]"
                      "@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      STATE_FILE
                  ],
                  check=True
              )

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )

              if result.returncode != 0:

                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Update scanner state"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "push"
                      ],
                      check=True
                  )

                  print(
                      "💾 Memoria guardada"
                  )

              else:

                  print(
                      "ℹ️ Sin cambios de memoria"
                  )

          except Exception as e:

              print(
                  "⚠️ No se pudo guardar "
                  "la memoria:"
              )

              print(e)

          # ==================================================
          # RESUMEN
          # ==================================================

          print("=" * 70)

          print(
              f"🎯 Candidatas: "
              f"{candidates}"
          )

          print(
              f"🚨 Alertas nuevas: "
              f"{alerts}"
          )

          print(
              f"⚠️ Errores: "
              f"{errors}"
          )

          print(
              "🧠 MEMORIA ACTUALIZADA"
          )

          print(
              "✅ ESCANEO TERMINADO"
          )

          print("=" * 70)

          PY
