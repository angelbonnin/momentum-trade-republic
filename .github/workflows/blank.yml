name: Marketaux Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Probar Marketaux
        env:
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          API_KEY = os.environ["MARKETAUX_API_KEY"]

          params = urllib.parse.urlencode({
              "api_token": API_KEY,
              "symbols": "MRNA",
              "filter_entities": "true",
              "language": "en",
              "limit": "5"
          })

          url = (
              "https://api.marketaux.com/v1/news/all?"
              + params
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                      "OpportunityScanner/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.load(response)

              print("=" * 60)
              print("MARKETAUX")
              print("=" * 60)

              if "data" not in data:

                  print("❌ No se recibió el campo data")
                  print(data)
                  raise SystemExit(1)

              articles = data["data"]

              print(
                  f"Noticias recibidas: "
                  f"{len(articles)}"
              )

              print()

              for article in articles:

                  title = article.get(
                      "title",
                      "Sin título"
                  )

                  source = article.get(
                      "source",
                      "Desconocida"
                  )

                  published = article.get(
                      "published_at",
                      "Fecha desconocida"
                  )

                  print("📰", title)
                  print("Fuente:", source)
                  print("Fecha:", published)
                  print("-" * 60)

              print()
              print("✅ PRUEBA COMPLETADA")

          except Exception as error:

              print("❌ ERROR MARKETAUX")
              print(
                  type(error).__name__
              )
              print(str(error))

              raise SystemExit(1)

          PY
