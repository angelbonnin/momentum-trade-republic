name: Market Movers Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Probar Market Movers
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          params = urllib.parse.urlencode({
              "apikey": API_KEY
          })

          url = (
              "https://api.twelvedata.com/"
              "market_movers/stocks?"
              + params
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                      "OpportunityScanner/4.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.load(response)

              print("=" * 60)
              print("🚀 TWELVE DATA MARKET MOVERS")
              print("=" * 60)

              if "values" not in data:

                  print("❌ No se recibió 'values'")
                  print(data)

                  raise SystemExit(1)

              movers = data["values"]

              print(
                  f"Movimientos recibidos: "
                  f"{len(movers)}"
              )

              print()

              for stock in movers[:20]:

                  symbol = stock.get(
                      "symbol",
                      "?"
                  )

                  name = stock.get(
                      "name",
                      "?"
                  )

                  percent = stock.get(
                      "percent_change",
                      0
                  )

                  volume = stock.get(
                      "volume",
                      0
                  )

                  price = stock.get(
                      "last",
                      0
                  )

                  print(
                      f"{symbol:8} | "
                      f"{str(percent):>8}% | "
                      f"${str(price):>10} | "
                      f"Vol: {volume} | "
                      f"{name}"
                  )

              print()
              print("=" * 60)
              print("✅ MARKET MOVERS FUNCIONA")
              print("=" * 60)

          except Exception as error:

              print("=" * 60)
              print("❌ ERROR MARKET MOVERS")
              print("=" * 60)

              print(
                  type(error).__name__
              )

              print(str(error))

              raise SystemExit(1)

          PY
