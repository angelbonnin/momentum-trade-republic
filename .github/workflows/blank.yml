name: Opportunity Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 13-19 * * 1-5"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Opportunity Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          TD = os.environ["TWELVE_DATA_API_KEY"]
          MX = os.environ["MARKETAUX_API_KEY"]
          BOT = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT = os.environ["TELEGRAM_CHAT_ID"]

          run = int(os.environ.get("RUN_NUMBER", "1"))

          # ==================================================
          # UNIVERSO
          # ==================================================

          groups = [

              [
                  "NVDA","AMD","AVGO","MU",
                  "MRVL","ARM","SMCI","INTC"
              ],

              [
                  "TSLA","PLTR","APP","HOOD",
                  "COIN","MSTR","MARA","RIVN"
              ],

              [
                  "META","AMZN","NFLX","GOOG",
                  "GOOGL","AAPL","MSFT","ORCL"
              ],

              [
                  "CRWD","PANW","SNOW","DDOG",
                  "NET","RBLX","SHOP","U"
              ],

              [
                  "UBER","ABNB","CVNA","SOFI",
                  "NIO","LI","XPEV","BABA"
              ],

              [
                  "JPM","BAC","GS","MS",
                  "C","WFC","V","MA"
              ],

              [
                  "MRNA","PFE","LLY","BNTX",
                  "REGN","VRTX","GILD","BIIB"
              ],

              [
                  "XOM","CVX","OXY","SLB",
                  "COP","FANG","MPC","VLO"
              ],

              [
                  "BA","GE","CAT","DE",
                  "LMT","RTX","NOC","GD"
              ],

              [
                  "T","VZ","TMUS","CMCSA",
                  "DIS","WBD","TGT","COST"
              ]

          ]

          group_index = (
              (run - 1) % len(groups)
          )

          symbols = groups[group_index]

          print("=" * 65)
          print("🚨 OPPORTUNITY SCANNER V5")
          print("=" * 65)

          print(
              f"Grupo {group_index + 1}/"
              f"{len(groups)}"
          )

          print(
              "Acciones:",
              ", ".join(symbols)
          )

          # ==================================================
          # TELEGRAM
          # ==================================================

          def telegram(message):

              url = (
                  "https://api.telegram.org/"
                  f"bot{BOT}/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": CHAT,
                  "text": message
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=data
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as r:

                  return r.read()

          # ==================================================
          # MARKET DATA
          # ==================================================

          params = urllib.parse.urlencode({
              "symbol": ",".join(symbols),
              "interval": "1min",
              "outputsize": "61",
              "apikey": TD
          })

          url = (
              "https://api.twelvedata.com/time_series?"
              + params
          )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "OpportunityScanner/5.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as r:

                  market = json.load(r)

          except Exception as e:

              print("❌ ERROR TWELVE DATA")
              print(e)

              raise SystemExit(1)

          candidates = 0
          errors = 0

          # ==================================================
          # CATALIZADORES
          # ==================================================

          strong = [
              "fda",
              "approval",
              "approved",
              "clinical trial",
              "clinical results",
              "phase 1",
              "phase 2",
              "phase 3",
              "positive results",
              "earnings",
              "quarterly results",
              "guidance",
              "acquisition",
              "acquire",
              "merger",
              "contract",
              "major contract",
              "partnership",
              "agreement",
              "deal",
              "regulatory",
              "buyback",
              "share repurchase",
              "product launch"
          ]

          medium = [
              "upgrade",
              "downgrade",
              "price target",
              "analyst",
              "expansion",
              "collaboration",
              "investment",
              "forecast",
              "outlook"
          ]

          def classify(article):

              text = " ".join([
                  str(article.get("title", "")),
                  str(article.get("description", "")),
                  str(article.get("snippet", ""))
              ]).lower()

              strong_hits = [
                  x for x in strong
                  if x in text
              ]

              medium_hits = [
                  x for x in medium
                  if x in text
              ]

              if strong_hits:

                  return (
                      "🔴 MUY FUERTE",
                      25,
                      strong_hits
                  )

              if medium_hits:

                  return (
                      "🟠 MEDIO",
                      12,
                      medium_hits
                  )

              return (
                  "⚪ DÉBIL",
                  0,
                  []
              )

          # ==================================================
          # ANALISIS
          # ==================================================

          for symbol in symbols:

              try:

                  if symbol not in market:

                      print(
                          f"❌ {symbol}: "
                          "sin datos"
                      )

                      errors += 1
                      continue

                  data = market[symbol]

                  if "values" not in data:

                      print(
                          f"❌ {symbol}: "
                          "sin velas"
                      )

                      errors += 1
                      continue

                  candles = data["values"]

                  if len(candles) < 61:

                      print(
                          f"⚠️ {symbol}: "
                          "datos insuficientes"
                      )

                      continue

                  # ==================================================
                  # PRECIOS
                  # ==================================================

                  current = float(
                      candles[0]["close"]
                  )

                  p5 = float(
                      candles[5]["close"]
                  )

                  p15 = float(
                      candles[15]["close"]
                  )

                  p30 = float(
                      candles[30]["close"]
                  )

                  p60 = float(
                      candles[60]["close"]
                  )

                  change5 = (
                      (current - p5)
                      / p5
                  ) * 100

                  change15 = (
                      (current - p15)
                      / p15
                  ) * 100

                  change30 = (
                      (current - p30)
                      / p30
                  ) * 100

                  change60 = (
                      (current - p60)
                      / p60
                  ) * 100

                  # ==================================================
                  # ACELERACION
                  # ==================================================

                  move_60_30 = (
                      (p30 - p60)
                      / p60
                  ) * 100

                  move_30_15 = (
                      (p15 - p30)
                      / p30
                  ) * 100

                  move_15_0 = (
                      (current - p15)
                      / p15
                  ) * 100

                  acceleration = (
                      move_15_0
                      - move_30_15
                  )

                  # ==================================================
                  # MAXIMO 60 MIN
                  # ==================================================

                  highs = []

                  for candle in candles:

                      try:

                          highs.append(
                              float(
                                  candle["high"]
                              )
                          )

                      except:

                          pass

                  high = max(highs)

                  distance_high = (
                      (high - current)
                      / high
                  ) * 100

                  # ==================================================
                  # VOLUMEN
                  # ==================================================

                  volumes = []

                  for candle in candles:

                      try:

                          volumes.append(
                              float(
                                  candle["volume"]
                              )
                          )

                      except:

                          pass

                  if len(volumes) >= 10:

                      current_volume = volumes[0]

                      average_volume = (
                          sum(volumes[1:])
                          /
                          len(volumes[1:])
                      )

                      if average_volume > 0:

                          volume_ratio = (
                              current_volume
                              /
                              average_volume
                          )

                      else:

                          volume_ratio = 0

                  else:

                      volume_ratio = 0

                  # ==================================================
                  # SCORE TECNICO
                  # ==================================================

                  score = 0

                  # Movimiento
                  if change30 >= 3:
                      score += 20

                  if change30 >= 5:
                      score += 10

                  # Volumen
                  if volume_ratio >= 3:
                      score += 15

                  if volume_ratio >= 5:
                      score += 10

                  if volume_ratio >= 8:
                      score += 5

                  # Aceleración
                  if acceleration > 0:
                      score += 10

                  if acceleration >= 2:
                      score += 5

                  # Cerca del máximo
                  if distance_high <= 1:
                      score += 5

                  # ==================================================
                  # CLASIFICACION DEL MOMENTO
                  # ==================================================

                  if change30 >= 10:

                      timing = "🔴 EXTENDED"

                  elif change30 >= 7:

                      timing = "🟠 LATE"

                  elif (
                      change30 >= 3
                      and
                      acceleration > 1
                      and
                      volume_ratio >= 3
                  ):

                      timing = "🟢 EARLY"

                  elif change30 >= 3:

                      timing = "🟡 MOMENTUM"

                  else:

                      timing = "⚪ NORMAL"

                  # ==================================================
                  # PENALIZACION POR EXTENSION
                  # ==================================================

                  adjusted_score = score

                  if timing == "🟠 LATE":

                      adjusted_score -= 10

                  elif timing == "🔴 EXTENDED":

                      adjusted_score -= 20

                  if adjusted_score < 0:

                      adjusted_score = 0

                  print(
                      f"{symbol} | "
                      f"5m {change5:+.2f}% | "
                      f"15m {change15:+.2f}% | "
                      f"30m {change30:+.2f}% | "
                      f"60m {change60:+.2f}% | "
                      f"Vol {volume_ratio:.1f}x | "
                      f"{timing} | "
                      f"Score {adjusted_score}"
                  )

                  # ==================================================
                  # FILTRO
                  # ==================================================

                  if not (
                      change30 >= 3
                      and
                      volume_ratio >= 3
                      and
                      adjusted_score >= 45
                  ):

                      continue

                  candidates += 1

                  print(
                      f"🔎 CANDIDATA: "
                      f"{symbol}"
                  )

                  # ==================================================
                  # MARKETaux
                  # ==================================================

                  after = (
                      datetime.now(
                          timezone.utc
                      )
                      -
                      timedelta(hours=3)
                  ).strftime(
                      "%Y-%m-%dT%H:%M"
                  )

                  news_params = urllib.parse.urlencode({

                      "api_token": MX,

                      "symbols": symbol,

                      "filter_entities": "true",

                      "must_have_entities": "true",

                      "language": "en",

                      "limit": "5",

                      "published_after": after,

                      "sort": "published_at"

                  })

                  news_url = (
                      "https://api.marketaux.com/"
                      "v1/news/all?"
                      + news_params
                  )

                  news_req = urllib.request.Request(
                      news_url,
                      headers={
                          "User-Agent":
                          "OpportunityScanner/5.0"
                      }
                  )

                  articles = []

                  try:

                      with urllib.request.urlopen(
                          news_req,
                          timeout=30
                      ) as r:

                          news_data = json.load(r)

                      articles = news_data.get(
                          "data",
                          []
                      )

                  except Exception as e:

                      print(
                          f"⚠️ Marketaux "
                          f"{symbol}: {e}"
                      )

                  # ==================================================
                  # MEJOR CATALIZADOR
                  # ==================================================

                  best = None
                  news_bonus = 0
                  category = "⚪ SIN CATALIZADOR"
                  hits = []

                  for article in articles:

                      cat, bonus, found = (
                          classify(article)
                      )

                      if bonus > news_bonus:

                          best = article
                          news_bonus = bonus
                          category = cat
                          hits = found

                  # ==================================================
                  # SCORE FINAL
                  # ==================================================

                  final_score = (
                      adjusted_score
                      + news_bonus
                  )

                  if final_score > 100:
                      final_score = 100

                  # ==================================================
                  # NIVEL
                  # ==================================================

                  if final_score >= 90:

                      level = "🔴 EXCEPCIONAL"

                  elif final_score >= 80:

                      level = "🔴 MUY FUERTE"

                  elif final_score >= 70:

                      level = "🟠 FUERTE"

                  elif final_score >= 55:

                      level = "🟡 INTERESANTE"

                  else:

                      level = "⚪ VIGILAR"

                  # ==================================================
                  # NOTICIA
                  # ==================================================

                  if best:

                      title = best.get(
                          "title",
                          "Sin título"
                      )

                      source = best.get(
                          "source",
                          "Desconocida"
                      )

                      article_url = best.get(
                          "url",
                          ""
                      )

                  else:

                      title = (
                          "No se detectó "
                          "catalizador reciente."
                      )

                      source = ""
                      article_url = ""

                  # ==================================================
                  # TELEGRAM
                  # ==================================================

                  message = (
                      "🚨 OPORTUNIDAD MOMENTUM\n\n"

                      f"📈 {symbol}\n"

                      f"🎯 SCORE: "
                      f"{final_score}/100\n"

                      f"{level}\n\n"

                      f"⏱ MOMENTO: "
                      f"{timing}\n\n"

                      f"💰 Precio: "
                      f"${current:.2f}\n"

                      f"📊 5 min: "
                      f"{change5:+.2f}%\n"

                      f"📊 15 min: "
                      f"{change15:+.2f}%\n"

                      f"📊 30 min: "
                      f"{change30:+.2f}%\n"

                      f"📊 60 min: "
                      f"{change60:+.2f}%\n"

                      f"🔥 Volumen: "
                      f"{volume_ratio:.1f}x\n"

                      f"⚡ Aceleración: "
                      f"{acceleration:+.2f}\n"

                      f"📈 Distancia máximo: "
                      f"{distance_high:.2f}%\n\n"

                      f"📰 CATALIZADOR: "
                      f"{category}\n"
                  )

                  if best:

                      message += (
                          f"\n{title}\n"
                      )

                      if source:

                          message += (
                              f"Fuente: "
                              f"{source}\n"
                          )

                      if hits:

                          message += (
                              "\n🔎 Detectado: "
                              +
                              ", ".join(
                                  hits[:4]
                              )
                              +
                              "\n"
                          )

                      if article_url:

                          message += (
                              f"\n🔗 "
                              f"{article_url}\n"
                          )

                  else:

                      message += (
                          "\nSin noticia relevante "
                          "en las últimas 3h.\n"
                      )

                  message += (
                      "\n⚠️ Radar de oportunidades. "
                      "No es una recomendación "
                      "automática de compra."
                  )

                  try:

                      telegram(message)

                      print(
                          f"📱 ALERTA "
                          f"{symbol}"
                      )

                  except Exception as e:

                      print(
                          f"❌ TELEGRAM "
                          f"{symbol}: {e}"
                      )

              except Exception as e:

                  print(
                      f"⚠️ {symbol}: "
                      f"{type(e).__name__}: {e}"
                  )

                  errors += 1

          # ==================================================
          # RESUMEN
          # ==================================================

          print("=" * 65)

          print(
              f"🎯 Candidatas: "
              f"{candidates}"
          )

          print(
              f"⚠️ Errores: "
              f"{errors}"
          )

          print(
              "✅ ESCANEO TERMINADO"
          )

          print("=" * 65)

          PY
