name: Momentum Detector

on:
  workflow_dispatch:

jobs:
  test-groups:
    runs-on: ubuntu-latest

    steps:
      - name: Probar grupo de acciones
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          GROUPS = [
              ["NVDA", "AMD", "TSLA", "PLTR", "COIN", "HOOD", "MSTR", "SMCI"],
              ["APP", "ARM", "AVGO", "MU", "MRVL", "TSM", "QCOM", "INTC"],
              ["AMZN", "META", "NFLX", "GOOG", "GOOGL", "AAPL", "MSFT", "AMAT"],
              ["LRCX", "CRWD", "PANW", "SNOW", "DDOG", "NET", "RBLX", "SHOP"],
              ["UBER", "ABNB", "MELI", "CVNA", "RIVN", "NIO", "SOFI", "MARA"]
          ]

          run_number = int(
              os.environ.get("RUN_NUMBER", "1")
          )

          group_index = (run_number - 1) % len(GROUPS)
          symbols = GROUPS[group_index]

          print("=" * 60)
          print("PRUEBA DE GRUPOS")
          print("=" * 60)
          print(f"Ejecución: {run_number}")
          print(f"Grupo seleccionado: {group_index + 1}/5")
          print("Acciones:")
          print(", ".join(symbols))
          print("=" * 60)

          params = urllib.parse.urlencode({
              "symbol": ",".join(symbols),
              "interval": "1min",
              "outputsize": "61",
              "apikey": API_KEY
          })

          url = (
              "https://api.twelvedata.com/time_series?"
              + params
          )

          try:

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "MomentumDetector/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.load(response)

          except Exception as error:

              print("❌ ERROR DE TWELVE DATA")
              print(type(error).__name__)
              print(str(error))
              raise SystemExit(1)

          print()
          print("RESULTADO:")
          print()

          errors = 0

          for symbol in symbols:

              if symbol not in data:

                  print(f"❌ {symbol}: no recibido")
                  errors += 1
                  continue

              if "values" not in data[symbol]:

                  print(f"❌ {symbol}: sin velas")
                  errors += 1
                  continue

              values = data[symbol]["values"]

              print(
                  f"✅ {symbol}: "
                  f"{len(values)} velas"
              )

          print()
          print("=" * 60)
          print(f"Errores: {errors}")
          print("=" * 60)

          if errors > 0:
              raise SystemExit(1)

          print("✅ PRUEBA COMPLETADA CORRECTAMENTE")

          PY
